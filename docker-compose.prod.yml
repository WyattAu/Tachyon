version: '3.8'

x-common-env: &common-env
  DOMAIN: ${DOMAIN:-localhost}
  EMAIL: ${EMAIL:-admin@localhost}

services:
  backend:
    image: tachyon/server:${VERSION:-latest}
    restart: always
    environment:
      - RUST_LOG=${RUST_LOG:-warn}
      - DATABASE_URL=postgres://tachyon:${POSTGRES_PASSWORD}@postgres:5432/tachyon
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-86400}
      - REDIS_URL=redis://redis:6379
      - CORS_ORIGINS=${CORS_ORIGINS}
      - METRICS_ENABLED=true
    deploy:
      mode: replicated
      replicas: 3
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: tachyon/frontend:${VERSION:-latest}
    restart: always
    deploy:
      mode: replicated
      replicas: 2
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
      update_config:
        parallelism: 1
        delay: 5s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=tachyon
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=tachyon
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tachyon -d tachyon"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      <<: *common-env
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl.conf:/etc/nginx/ssl.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_webroot:/var/www/certbot:ro
      - certs:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
      - certbot
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  certbot:
    image: certbot/certbot
    restart: always
    environment:
      <<: *common-env
    volumes:
      - certbot_webroot:/var/www/certbot
      - certs:/etc/letsencrypt
    entrypoint:
      - /bin/sh
      - -c
      - |
        trap exit TERM
        if [ ! -f "/etc/letsencrypt/nginx/fullchain.pem" ]; then
          echo "Obtaining initial certificate for $$DOMAIN ..."
          certbot certonly --webroot -w /var/www/certbot \
            --email "$$EMAIL" --agree-tos --no-eff-email \
            -d "$$DOMAIN" --non-interactive \
            --deploy-hook "mkdir -p /etc/letsencrypt/nginx && cp -L /etc/letsencrypt/live/$$DOMAIN/fullchain.pem /etc/letsencrypt/live/$$DOMAIN/privkey.pem /etc/letsencrypt/nginx/"
        fi
        while :; do
          certbot renew
          sleep 12h &
          wait "$$!"
        done
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  certbot-test:
    image: certbot/certbot
    profiles:
      - test
    environment:
      <<: *common-env
    volumes:
      - certbot_webroot:/var/www/certbot
      - certs:/etc/letsencrypt
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "Running certbot in staging mode for $$DOMAIN ..."
        certbot certonly --webroot --staging --dry-run \
          -w /var/www/certbot \
          --email "$$EMAIL" --agree-tos --no-eff-email \
          -d "$$DOMAIN" --non-interactive
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  certbot_webroot:
  certs:

[rationale]
criticality = "HIGH"
justification = """
tantivy is the full-text search engine library used throughout Tachyon for
document indexing and search functionality. It provides:
- Lucene-compatible indexing
- Fast full-text search capabilities
- Support for complex queries and filtering
- Integration with Tachyon's document search system

This is a core dependency for search and indexing functionality.
"""


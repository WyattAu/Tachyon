pulldown-cmark is the Markdown parser used throughout Tachyon for processing
and rendering markdown content. It provides:
- Fast CommonMark compliant parsing
- Support for GFM (GitHub Flavored Markdown)
- SIMD optimizations for better performance
- Extensible event-based API for custom rendering

This is a core dependency for document processing functionality.
"""


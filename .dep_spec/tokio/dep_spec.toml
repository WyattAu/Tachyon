[metadata]
name = "tokio"
version = "1.49.0"
language = "rust"
registry = "https://crates.io"
source = "registry+https://github.com/rust-lang/crates.io-index"
checksum = "72a2903cd7736441aac9df9d7688bd0ce48edccaadf181c3b90be801e81d3d86"
license = "MIT"
repository = "https://github.com/tokio-rs/tokio"
homepage = "https://tokio.rs/"
documentation = "https://docs.rs/tokio"
authors = ["Tokio Contributors"]

[rationale]
criticality = "HIGH"
justification = """
tokio is the async runtime for Rust and the foundation of Tachyon's
concurrent architecture. It provides:
- Asynchronous I/O operations
- Multi-threaded task scheduling
- Timer and timeout utilities
- Synchronization primitives
- Integration with Rust's async ecosystem

This is the most critical dependency in the entire project, as all async
operations depend on it.
"""

[security]
audit_status = "PENDING"
last_audit_date = "2026-02-11"
known_vulnerabilities = []
cvss_score = "N/A"
notes = """
tokio is a mature, well-audited library. However:
- Large dependency tree increases attack surface
- Some features use native system calls
Recommendation: Enable only necessary features to reduce attack surface
"""

[dependencies]
native = ["libc", "mio"]
transitive = [
    "bytes", "libc", "mio", "parking_lot", "pin-project-lite",
    "signal-hook-registry", "socket2", "tokio-macros",
    "windows-sys"
]

[features]
enabled = ["full"]
description = "Full feature set includes I/O, time, sync, and macros"
core_features = ["io-util", "time", "rt-multi-thread", "sync"]
optional_features = ["fs", "net", "process", "signal"]

[alternatives]
considered = [
    {name = "async-std", reason = "Less mature, smaller ecosystem"},
    {name = "smol", reason = "More experimental, smaller community"},
]
selected = "tokio"
selection_reason = "De facto standard, best ecosystem support, highly optimized"

[maintenance]

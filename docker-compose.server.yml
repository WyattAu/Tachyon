services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tachyon
      POSTGRES_USER: tachyon
      POSTGRES_PASSWORD: tachyon
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tachyon -d tachyon"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://tachyon:tachyon@postgres:5432/tachyon
      TACHYON_JWT_SECRET: deploy-secret-key-for-cachyos-server-at-least-64-chars-long-for-production-use
      TACHYON_JWT_SECRETS: deploy-secret-key-for-cachyos-server-at-least-64-chars-long-for-production-use
      TACHYON_SERVER_HOST: 0.0.0.0
      TACHYON_SERVER_PORT: "8080"
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tachyon/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('tachyon/Cargo.lock') }}

      - name: Check workspace
        working-directory: tachyon
        run: cargo check --workspace --exclude tachyon-desktop --exclude tachyon-desktop-app --exclude tachyon-cli --exclude tachyon-testing

      - name: Check WASM compilation
        working-directory: tachyon
        run: cargo check -p tachyon-frontend -p tachyon-editor --target wasm32-unknown-unknown

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tachyon/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('tachyon/Cargo.lock') }}

      - name: Check formatting
        working-directory: tachyon
        run: cargo fmt --all -- --check

      - name: Run clippy
        working-directory: tachyon
        run: cargo clippy --workspace --exclude tachyon-desktop --exclude tachyon-desktop-app --exclude tachyon-cli --exclude tachyon-testing --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tachyon
          POSTGRES_PASSWORD: tachyon
          POSTGRES_DB: tachyon_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tachyon/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('tachyon/Cargo.lock') }}

      - name: Run unit tests
        working-directory: tachyon
        run: cargo test --workspace --exclude tachyon-frontend --exclude tachyon-testing --exclude tachyon-desktop --exclude tachyon-desktop-app --exclude tachyon-cli --lib

      - name: Run integration tests
        working-directory: tachyon
        env:
          DATABASE_URL: postgres://tachyon:tachyon@localhost:5432/tachyon_test
          TEST_DATABASE_URL: postgres://tachyon:tachyon@localhost:5432/tachyon_test
        run: cargo test --workspace --exclude tachyon-frontend --exclude tachyon-testing --exclude tachyon-desktop --exclude tachyon-desktop-app --exclude tachyon-cli --test integration -- --test-threads=1

  build:
    name: Build Release
    runs-on: ubuntu-latest
    needs: [check, lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tachyon/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('tachyon/Cargo.lock') }}

      - name: Build backend
        working-directory: tachyon
        run: cargo build --release -p tachyon-server

      - uses: actions/upload-artifact@v4
        with:
          name: tachyon-server
          path: tachyon/target/release/tachyon-server
          retention-days: 7

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [check, lint]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tachyon/target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('tachyon/Cargo.lock') }}

      - name: Install trunk
        run: cargo install trunk

      - name: Build frontend
        working-directory: tachyon/crates/frontend
        run: trunk build --release

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: tachyon/crates/frontend/dist
          retention-days: 7

  benchmark:
    name: Benchmarks
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tachyon/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('tachyon/Cargo.lock') }}

      - name: Run benchmarks
        working-directory: tachyon
        run: TMPDIR=/tmp cargo bench -p tachyon-benchmarks -- --output-format bencher | tee benchmark-results.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: tachyon/benchmark-results.txt
          retention-days: 30

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tachyon
          POSTGRES_PASSWORD: tachyon
          POSTGRES_DB: tachyon_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tachyon/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('tachyon/Cargo.lock') }}

      - name: Generate coverage
        working-directory: tachyon
        env:
          DATABASE_URL: postgres://tachyon:tachyon@localhost:5432/tachyon_test
          TEST_DATABASE_URL: postgres://tachyon:tachyon@localhost:5432/tachyon_test
        run: cargo tarpaulin --workspace --exclude tachyon-testing --exclude tachyon-frontend --exclude tachyon-desktop --exclude tachyon-desktop-app --exclude tachyon-cli --out xml --output-dir coverage/ -- --test-threads=1

      - name: Check minimum coverage (60%)
        working-directory: tachyon
        run: |
          COVERAGE=$(grep -oP 'line-rate="\K[^"]+' coverage/coverage.xml | head -1)
          THRESHOLD=0.60
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "Coverage ${COVERAGE} is below threshold ${THRESHOLD}"
            exit 1
          fi
          echo "Coverage ${COVERAGE} meets threshold ${THRESHOLD}"

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: tachyon/coverage/
          retention-days: 14

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build, build-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: tachyon:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        timeout-minutes: 20

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tachyon/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('tachyon/Cargo.lock') }}

      - name: Check formatting
        working-directory: tachyon
        run: cargo fmt --all -- --check

      - name: Run clippy
        working-directory: tachyon
        run: cargo clippy --workspace --exclude tachyon-frontend --exclude tachyon-testing -- -D warnings

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tachyon/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('tachyon/Cargo.lock') }}

      - name: Build backend
        working-directory: tachyon
        run: cargo build --release -p tachyon-server

      - uses: actions/upload-artifact@v4
        with:
          name: backend-binary
          path: tachyon/target/release/tachyon-server
          retention-days: 7

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tachyon/target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('tachyon/Cargo.lock') }}

      - name: Install trunk
        run: cargo install trunk

      - name: Build frontend
        working-directory: tachyon/crates/frontend
        run: trunk build --release

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: tachyon/crates/frontend/dist
          retention-days: 7

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [build-backend]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tachyon/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('tachyon/Cargo.lock') }}

      - name: Run tests
        working-directory: tachyon
        run: cargo test --workspace --exclude tachyon-frontend --exclude tachyon-testing --lib

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build-backend]
    steps:
      - uses: actions/checkout@v4

      - name: Download backend binary
        uses: actions/download-artifact@v4
        with:
          name: backend-binary
          path: tachyon/target/release/

      - name: Make binary executable
        run: chmod +x tachyon/target/release/tachyon-server

      - name: Start PostgreSQL
        uses: hoverkraft-tech/compose-action@v2
        with:
          compose-file: tachyon/docker-compose.yml
          services: |
            db

      - name: Wait for database
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5433 -q; then
              echo "Database is ready"
              break
            fi
            echo "Waiting for database... ($i/30)"
            sleep 2
          done

      - name: Run migrations
        env:
          DATABASE_URL: postgres://tachyon:tachyon@localhost:5433/tachyon
        run: |
          cd tachyon
          sqlx migrate run
        continue-on-error: true

      - name: Start server
        env:
          DATABASE_URL: postgres://tachyon:tachyon@localhost:5433/tachyon
          TACHYON_HOST: 127.0.0.1
          TACHYON_PORT: "8080"
          TACHYON_JWT_SECRET: ci-test-secret
          TACHYON_CORS_ORIGINS: '["http://localhost:8080"]'
          TACHYON_RATE_LIMIT_ENABLED: "false"
        run: |
          cd tachyon
          ./target/release/tachyon-server &
          sleep 3

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        working-directory: tachyon/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: tachyon/e2e
        env:
          E2E_BASE_URL: http://localhost:8080
        run: npx playwright test tests/ --project=chromium --reporter=list

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: tachyon
          file: tachyon/Dockerfile
          push: false
          tags: tachyon/server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: tachyon
          file: tachyon/Dockerfile.frontend
          push: false
          tags: tachyon/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

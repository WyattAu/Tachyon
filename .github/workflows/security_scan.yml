name: Security Scan

on:
  push:
    branches: [main, develop, 'release/*']
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * *'  # Daily at 02:00 UTC
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # SAST: Static Application Security Testing
  sast:
    name: SAST
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install security tools
        run: |
          cargo install cargo-audit cargo-deny

      - name: Run cargo audit
        run: cargo audit --color always --json > audit-report.json
        continue-on-error: true

      - name: Parse audit results
        run: |
          python .github/scripts/parse_audit_results.py \
            --input audit-report.json \
            --output audit-parsed.json

      - name: Check for critical vulnerabilities
        run: |
          python .github/scripts/check_vulnerabilities.py \
            --input audit-parsed.json \
            --max-severity HIGH \
            --fail-on-critical

      - name: Run cargo deny checks
        run: cargo deny check bans licenses sources advisories

      - name: Upload SAST results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-results
          path: |
            audit-report.json
            audit-parsed.json
          retention-days: 30

  # Dependency Scan: Vulnerability check for dependencies
  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install Trivy
        run: |
          wget -qO - https://github.com/aquasecurity/trivy/releases/download/v0.50.0/trivy_0.50.0_Linux-64bit.tar.gz
          tar zxvf trivy_0.50.0_Linux-64bit.tar.gz
          sudo mv trivy /usr/local/bin/

      - name: Scan Rust dependencies
        run: |
          trivy config --download-db-only
          trivy fs --security-checks vuln,license \
            --format json \
            --output trivy-dependencies.json \
            --severity HIGH,CRITICAL \
            tachyon/Cargo.lock

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scan Node dependencies
        run: |
          cd tachyon/web
          npm audit --json > npm-audit.json || true

      - name: Parse dependency scan results
        run: |
          python .github/scripts/parse_dependency_scan.py \
            --trivy-input trivy-dependencies.json \
            --npm-input npm-audit.json \
            --output dependency-scan-results.json

      - name: Check for critical vulnerabilities
        run: |
          python .github/scripts/check_vulnerabilities.py \
            --input dependency-scan-results.json \
            --max-severity HIGH \
            --fail-on-critical

      - name: Upload dependency scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-scan-results
          path: |
            trivy-dependencies.json
            npm-audit.json
            dependency-scan-results.json
          retention-days: 30

  # Secret Scan: Detect secrets in code
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GIT_FILTER_VALID_REGEXES: '^(dev-|staging|release)'

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog-actions@main
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.base_ref || github.event.before }}
          head: ${{ github.sha }}
          extra_args: --debug --only-verified

      - name: Upload secret scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-results
          path: |
            gitleaks-report.json
            trufflehog-report.json
          retention-days: 30

  # Container Scan: Scan Docker image
  container-scan:
    name: Container Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/tachyon/tachyon-server:${{ github.sha }} -f Dockerfile .

      - name: Install Trivy
        run: |
          wget -qO - https://github.com/aquasecurity/trivy/releases/download/v0.50.0/trivy_0.50.0_Linux-64bit.tar.gz
          tar zxvf trivy_0.50.0_Linux-64bit.tar.gz
          sudo mv trivy /usr/local/bin/

      - name: Scan Docker image
        run: |
          trivy image --security-checks vuln,license,config \
            --format json \
            --output trivy-container.json \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            ghcr.io/tachyon/tachyon-server:${{ github.sha }}

      - name: Parse container scan results
        run: |
          python .github/scripts/parse_container_scan.py \
            --input trivy-container.json \
            --output container-scan-results.json

      - name: Check for critical vulnerabilities
        run: |
          python .github/scripts/check_vulnerabilities.py \
            --input container-scan-results.json \
            --max-severity HIGH \
            --fail-on-critical

      - name: Upload container scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-scan-results
          path: |
            trivy-container.json
            container-scan-results.json
          retention-days: 30

  # License Scan: Check license compliance
  license-scan:
    name: License Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run license check
        run: |
          cargo deny check licenses

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check Node licenses
        run: |
          cd tachyon/web
          npx license-checker --production --onlyAllow 'MIT;Apache-2.0;BSD-3-Clause;ISC;Unicode-DFS-2016'

      - name: Upload license scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: license-scan-results
          path: |
            target/allowlist.txt
            target/exceptions.txt
          retention-days: 30

  # IaC Scan: Infrastructure as Code scanning
  iac-scan:
    name: IaC Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Checkov
        run: |
          pip3 install checkov

      - name: Run Checkov
        run: |
          checkov -d .github/workflows/ -f json \
            --output checkov-results.json \
            --framework github_actions

      - name: Upload IaC scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iac-scan-results
          path: |
            checkov-results.json
          retention-days: 30

  # Security Report Generation
  security-report:
    name: Security Report
    runs-on: ubuntu-latest
    needs: [sast, dependency-scan, secret-scan, license-scan]
    if: always()
    timeout-minutes: 10

    steps:
      - name: Download all scan results
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Generate security report
        run: |
          python .github/scripts/generate_security_report.py \
            --sast-input artifacts/sast-results/audit-parsed.json \
            --dependency-input artifacts/dependency-scan-results/dependency-scan-results.json \
            --secret-input artifacts/secret-scan-results/gitleaks-report.json \
            --license-input artifacts/license-scan-results/target/allowlist.txt \
            --output security-report.json

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: |
            security-report.json
          retention-days: 30

      - name: Post security summary to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('artifacts/security-report.json', 'utf8'));
            
            const summary = `
            ## Security Scan Summary
            
            ### SAST
            - Critical: ${report.sast.critical}
            - High: ${report.sast.high}
            - Medium: ${report.sast.medium}
            - Low: ${report.sast.low}
            
            ### Dependency Scan
            - Critical: ${report.dependencies.critical}
            - High: ${report.dependencies.high}
            - Medium: ${report.dependencies.medium}
            - Low: ${report.dependencies.low}
            
            ### Secret Scan
            - Secrets found: ${report.secrets.count}
            
            ### License Scan
            - License violations: ${report.licenses.violations}
            `;
            
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: summary
            });

  # Create Security Issue
  create-security-issue:
    name: Create Security Issue
    runs-on: ubuntu-latest
    needs: [security-report]
    if: |
      always() &&
      needs.security-report.result == 'success' &&
      github.event_name != 'pull_request'
    timeout-minutes: 5

    steps:
      - name: Download security report
        uses: actions/download-artifact@v4
        with:
          name: security-report

      - name: Check for critical vulnerabilities
        id: check-critical
        run: |
          python .github/scripts/check_critical_vulnerabilities.py \
            --input security-report.json \
            --output has-critical.txt

      - name: Create GitHub issue
        if: steps.check-critical.outputs.has-critical == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('security-report.json', 'utf8'));
            
            const title = `Security Vulnerabilities Detected - ${new Date().toISOString()}`;
            const body = `
            ## Security Vulnerability Report
            
            Critical and high severity vulnerabilities were detected in the Tachyon codebase.
            
            ### Vulnerability Summary
            
            | Type | Critical | High | Medium | Low |
            |------|----------|-------|--------|-----|
            | SAST | ${report.sast.critical} | ${report.sast.high} | ${report.sast.medium} | ${report.sast.low} |
            | Dependencies | ${report.dependencies.critical} | ${report.dependencies.high} | ${report.dependencies.medium} | ${report.dependencies.low} |
            | Secrets | ${report.secrets.critical} | ${report.secrets.high} | 0 | 0 |
            
            ### Action Required
            
            Please review and fix the critical and high severity vulnerabilities before proceeding with deployment.
            
            ### Details
            
            See the attached security report for detailed information about each vulnerability.
            
            **Pipeline ID:** ${{ needs.security-report.outputs.pipeline-id }}
            **Commit:** ${{ github.sha }}
            **Report ID:** ${report.reportId}
            `;
            
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['security', 'critical']
            });
            
            console.log(`Created issue: ${issue.data.number}`);

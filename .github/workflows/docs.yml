name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - 'documentation/**'
      - 'docs/**'
      - 'tachyon/crates/ssg/**'
      - 'tachyon/crates/renderer/**'
      - 'tachyon/crates/core/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache Cargo dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tachyon/target
          key: ${{ runner.os }}-cargo-docs-${{ hashFiles('tachyon/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-docs-

      - name: Build SSG CLI
        run: cargo build --release -p tachyon-ssg --bin tachyon-ssg-cli --manifest-path tachyon/Cargo.toml

      - name: Build documentation site
        run: |
          ./tachyon/target/release/tachyon-ssg-cli build \
            --input ./documentation \
            --output ./site \
            --base-url "https://wyattau.github.io/Tachyon"

      - name: Copy landing page
        run: cp docs/index.html ./site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-docs
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

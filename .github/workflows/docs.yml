name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - 'documentation/**'
      - 'tachyon/crates/ssg/**'
      - 'tachyon/crates/renderer/**'
      - 'tachyon/crates/core/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
        key: ${{ runner.os }}-cargo-docs-${{ hashFiles('tachyon/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-docs-

      - name: Build SSG CLI
        run: cargo build --release -p tachyon-ssg --bin tachyon-ssg-cli --manifest-path tachyon/Cargo.toml

      - name: Build documentation site
        run: |
          ./tachyon/target/release/tachyon-ssg-cli build \
            --input ./documentation \
            --output ./site \
            --base-url "https://wyattau.github.io/Tachyon"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-docs
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

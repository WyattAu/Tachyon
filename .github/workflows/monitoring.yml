name: Monitoring System Health

on:
  push:
    branches: [main]
    paths:
      - '.specs/**'
      - 'tachyon/**'
      - '.github/workflows/**'
  schedule:
    # Run every 15 minutes
    - cron: '*/15 * * * *'

jobs:
  health-checks:
    name: Service Health Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Tachyon Server Health
        run: |
          curl -f http://tachyon.io/health/ready \
            --max-time 10 || exit 1
          curl -f https://tachyon-dev.tachyon.io/health/ready \
            --max-time 10 || exit 1
          curl -f https://green.tachyon.io/health/ready \
            --max-time 10 || exit 1

      - name: Check Database Health
        run: |
          pg_isready ${{ secrets.DATABASE_URL }} \
            --timeout 10 || exit 1

      - name: Check Cache Health
        run: |
          redis-cli PING || exit 1

      - name: Check Load Balancer Health
        run: |
          curl -f https://tachyon.io/health \
            --max-time 5 || exit 1

  metrics-collection:
    name: Collect Metrics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query Prometheus Metrics
        run: |
          curl -s http://prometheus.tachyon.io/api/v1/query \
            --data-url encode "$(echo 'query{rate(http_requests_total[5m])} * 100 / {rate(http_errors_total[5m])} * 100' | base64)" \
            --max-time 30

      - name: Store Metrics Snapshot
        run: |
          curl -s http://prometheus.tachyon.io/api/v1/write \
            --data-url encode "$(echo 'snapshot{name=\"tachyon_metrics\",queries=[{\"query\":\"rate(http_requests_total[5m]) * 100 / {rate(http_errors_total[5m])} * 100\"},{\"query\":\"histogram_quantile(0.95,rate(http_requests_duration_seconds[5m]))\"},{\"query\":\"rate(http_errors_total[5m]) / {rate(http_requests_total[5m])} * 100\"},{\"query\":\"cache_hit_ratio\"}]}')" | base64"

  alert-evaluation:
    name: Evaluate Metrics Against Thresholds
    runs-on: ubuntu-latest
    needs: metrics-collection
    steps:
      - name: Get Metrics Data
        run: |
          RESPONSE=$(curl -s http://prometheus.tachyon.io/api/v1/query \
            --data-url encode "$(echo 'query{rate(http_requests_total[5m])} * 100 / {rate(http_errors_total[5m])} * 100}' | base64")
          ERROR_RATE=$(echo "${RESPONSE}" | jq -r '.data.result[0] // 100')
          P95=$(echo "${RESPONSE}" | jq -r '.data.result[2] // 100')
          
          echo "Error Rate: ${ERROR_RATE}%"
          echo "P95 Latency: ${P95}s"
          
          # Check thresholds
          if (( $(echo "${ERROR_RATE} > 0.1" | bc -l )); then
            echo "ERROR: Error rate exceeds 0.1%"
            exit 1
          fi
          
          if (( $(echo "${P95} > 0.2" | bc -l )); then
            echo "ERROR: P95 latency exceeds 0.2s"
            exit 1
          fi

      - name: Check Database Metrics
        run: |
          CONNECTIONS=$(curl -s http://prometheus.tachyon.io/api/v1/query \
            --data-url encode "$(echo 'query{pg_stat_database{instance=\"tachyon-server-*\"}[5m])}' | base64")
          SLOW_QUERIES=$(echo "${CONNECTIONS}" | jq -r '.data.result[0]' | bc -l)
          
          echo "Active Connections: ${CONNECTIONS}"
          
          if [ "${CONNECTIONS}" -gt 80 ]; then
            echo "WARNING: High connection count"
          fi

      - name: Check Cache Metrics
        run: |
          HIT_RATIO=$(curl -s http://prometheus.tachyon.io/api/v1/query \
            --data-url encode "$(echo 'query{cache_hit_ratio}' | base64")
          echo "Cache Hit Ratio: ${HIT_RATIO}%"
          
          if (( $(echo "${HIT_RATIO} < 0.8" | bc -l )); then
            echo "WARNING: Low cache hit ratio"
            exit 1
          fi

  backup-verification:
    name: Verify Backup Completeness
    runs-on: ubuntu-latest
    schedule:
      - cron: '0 6 * * *'
    timeout-minutes: 15
    steps:
      - name: Check Last Backup Time
        run: |
          LAST_BACKUP=$(aws s3 ls s3://tachyon-backups/database/ --recursive --summarize | \
            jq -r '.Contents[0].LastModified' | cut -d'T' -f1)
          
          HOURS_AGO=$(( ( $(date +%s) - ${LAST_BACKUP} ) / 3600 ))
          
          echo "Last backup was ${HOURS_AGO} hours ago"
          
          if [ "${HOURS_AGO}" -gt 28 ]; then
            echo "ERROR: Last backup is more than 28 hours old"
            send-alert "BackupStale" "Database backup hasn't run in 28 hours"
            exit 1
          fi

      - name: Check Backup Integrity
        run: |
          BACKUP_COUNT=$(aws s3 ls s3://tachyon-backups/database/ | wc -l)
          EXPECTED_COUNT=$(( 24 * 4 ))
          
          if [ "${BACKUP_COUNT}" -lt "${EXPECTED_COUNT}" ]; then
            echo "WARNING: Backup count ${BACKUP_COUNT} is less than expected ${EXPECTED_COUNT}"
            send-alert "BackupCountMismatch" "Expected 24 backups, found ${BACKUP_COUNT}"
          fi

  log-retention:
    name: Rotate Application Logs
    runs-on: ubuntu-latest
    schedule:
      - cron: '0 3 * * *'
    timeout-minutes: 15
    steps:
      - name: Archive Old Logs
        run: |
          cd /var/log/tachyon
          find . -name "*.log" -mtime +30d -exec gzip {} \;
          
      - name: Verify Log Retention
        run: |
          find /var/log/tachyon -name "*.log" -mtime +90d | wc -l
          LOG_COUNT=$(find . -name "*.log" -mtime +90d | wc -l)
          echo "Logs older than 90 days: ${LOG_COUNT}"

  security-scan:
    name: Daily Security Scan
    runs-on: ubuntu-latest
    schedule:
      - cron: '0 4 * * *'
    timeout-minutes: 30
    steps:
      - name: Scan Server Image
        run: |
          docker pull ghcr.io/tachyon/tachyon-server:latest
          trivy image --severity HIGH,CRITICAL \
            --output json \
            ghcr.io/tachyon/tachyon-server:latest \
            > trivy-results.json || true

      - name: Check Results
        run: |
          CRITICAL_COUNT=$(jq '.Results[] | select(.Severity == "CRITICAL") | length' trivy-results.json)
          
          if [ "${CRITICAL_COUNT}" -gt 0 ]; then
            echo "ERROR: Critical vulnerabilities found"
            send-alert "SecurityVulnerabilityCritical" "${CRITICAL_COUNT}"
            exit 1
          fi

      - name: Upload Results
        run: |
          aws s3 cp trivy-results.json \
            s3://tachyon-security-scans/$(date +%Y%m%d)/trivy-results.json

  system-maintenance:
    name: Weekly System Maintenance
    runs-on: ubuntu-latest
    schedule:
      - cron: '0 3 * * 1'
    timeout-minutes: 30
    steps:
      - name: Clean Up Old Docker Images
        run: |
          docker images prune -f --filter "until=24h" --filter label=tachyon
          
      - name: Clean Up Unused Kubernetes Resources
        run: |
          kubectl delete pods \
            -l app=tachyon-server \
            --field-selector=status.failed \
            --field-selector=status.phase=Succeeded \
            --field-selector=status.reason!=EvictedByController \
            --grace-period=60

  incident-detection:
    name: Detect Incident Patterns
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Error Spikes
        run: |
          ERROR_SPIKE=$(curl -s http://prometheus.tachyon.io/api/v1/query \
            --data-url encode "$(echo 'query{rate(http_errors_total[5m]) * 100}[5m:10m] > 5}' | base64")
          
          if [ "${ERROR_SPIKE}" -gt 5 ]; then
            echo "WARNING: Error rate spike detected"
            send-alert "ErrorRateSpike" "Error rate increased by $(echo "${ERROR_SPIKE}" | jq -r 'scale(2)' | bc -l)% over 10 minutes"
          fi

      - name: Check Performance Degradation
        run: |
          P95=$(curl -s http://prometheus.tachyon.io/api/v1/query \
            --data-url encode "$(echo 'query{histogram_quantile(0.95,rate(http_requests_duration_seconds[5m]))}' | base64")
          
          if [ "${P95}" -gt 0.15 ]; then
            echo "WARNING: P95 latency is $(echo "${P95}s")"
            send-alert "PerformanceDegradation" "P95 latency exceeds 150ms"
          fi

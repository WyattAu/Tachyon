name: Backup

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: false
        type: string
        default: 'manual'

concurrency:
  group: backup-${{ inputs.environment || 'scheduled' }}
  cancel-in-progress: false

jobs:
  backup-database:
    name: Backup Database
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder - database backup requires real credentials
        run: |
          echo "::warning::Database backup is not configured."
          echo "To back up a real database, this workflow needs the following secrets:"
          echo "  - PGHOST: PostgreSQL host (or SSH into the production server first)"
          echo "  - PGPORT: PostgreSQL port"
          echo "  - PGPASSWORD: PostgreSQL password"
          echo "  - PGDATABASE: Database name"
          echo ""
          echo "The typical approach is to SSH into the production server and run"
          echo "pg_dump there, since the database is not publicly accessible."
          echo ""
          echo "Steps to enable:"
          echo "  1. Add an SSH step using appleboy/ssh-action or similar"
          echo "  2. SSH into the server and run: pg_dump -F c -f /tmp/backup.dump"
          echo "  3. Copy the dump back or upload it as an artifact"
          echo "  4. Remove this placeholder step and uncomment the real backup steps"

  backup-configuration:
    name: Backup Configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Archive Configuration Files
        env:
          ENVIRONMENT: ${{ inputs.environment || 'scheduled' }}
        run: |
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%SZ)
          tar -czf "/tmp/config-${ENVIRONMENT}-${TIMESTAMP}.tar.gz" \
            .env.example \
            docker-compose.yml \
            docker-compose.prod.yml \
            nginx/
          echo "Archive size: $(du -h /tmp/config-${ENVIRONMENT}-${TIMESTAMP}.tar.gz | cut -f1)"

      - name: Upload Configuration Backup
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: config-${{ inputs.environment || 'scheduled' }}-${{ github.run_number }}
          path: /tmp/config-${{ inputs.environment || 'scheduled' }}-*.tar.gz
          retention-days: 7

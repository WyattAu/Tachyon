name: Deployment

on:
  push:
    branches: [main]
    paths:
      - '.specs/**'
      - 'tachyon/**'
      - '.github/workflows/**'
  workflow_dispatch:

env:
  DOCKER_REGISTRY: ghcr.io
  DOCKER_IMAGE: ghcr.io/tachyon/tachyon-server
  DOCKER_PLATFORM: linux/amd64
  KUBECONFIG: ${{ github.workspace }}/kubeconfig
  ENVIRONMENT: ${{ github.event.client_payload.environment }}

jobs:
  prepare-deployment:
    name: Prepare Deployment
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      image_tag: ${{ steps.version.outputs.image_tag }}
      image_name: ${{ steps.version.outputs.image_name }}
      previous_version: ${{ steps.version.outputs.previous_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Generate Version
        id: version
        run: |
          echo "version=$(date +'%Y.%m.%d%H%M%S')" >> $GITHUB_OUTPUT

      - name: Generate Image Tag
        id: image_tag
        run: |
          echo "image_tag=${{GITHUB_ENVIRONMENT:-production}-$(date +'%Y.%m.%d')}"

      - name: Generate Image Name
        id: image_name
        run: |
          echo "image_name=tachyon-server"

      - name: Get Previous Version
        id: previous_version
        run: |
          git -C tachyon fetch --tags='v*' --sort=-version:refname | head -1 | sed 's/refs\\/tags\\///v\\([^\\]*\\)/\\1\\./' | sed 's/\\1//' || echo "none"

  build-server:
    name: Build Server
    runs-on: ubuntu-latest
    needs: prepare-deployment
    outputs:
      version: ${{ steps.version.outputs.version }}
      image_name: ${{ steps.version.outputs.image_name }}
      image_tag: ${{ steps.version.outputs.image_tag }}
    steps:
      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Cache Cargo Registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/${{ runner.os }}-unknown-unknown-gnu/release/target
          key: ${{ runner.os }}-cargo-registry-index

      - name: Build Server Binary
        run: |
          cd tachyon/crates/server
          cargo build --release --bin tachyon_server

      - name: Build Docker Image
        run: |
          cd tachyon
          docker buildx build \
            --platform linux/amd64 \
            --build-arg VERSION=${{ needs.prepare-deployment.outputs.version }} \
            --build-arg BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            --file Dockerfile \
            --tag ghcr.io/tachyon/tachyon-server:${{ needs.prepare-deployment.outputs.image_tag }} \
            --push

  build-desktop-packages:
    name: Build Desktop Packages
    runs-on: ${{ matrix.os }}
    needs: prepare-deployment
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        include: [macos-latest]
    steps:
      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Cache Cargo Registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/${{ runner.os }}-unknown-unknown-gnu/release/target
          key: ${{ runner.os }}-cargo-registry-index

      - name: Build Desktop Binaries
        run: |
          cd tachyon/crates/desktop/src-tauri
          cargo tauri build --target ${{ matrix.os }}

      - name: Sign Windows Binary
        if: runner.os == 'ubuntu-latest'
        run: |
          cd tachyon/crates/desktop/src-tauri/target/release/bundle/nsis
          signtool sign \
            /f ${{ secrets.WINDOWS_CERTIFICATE }} \
            /p ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }} \
            /t http://timestamp.digicert.com \
            /fd tachyon-setup.exe

      - name: Notarize macOS Binary
        if: runner.os == 'macos-latest'
        run: |
          cd tachyon/crates/desktop/src-tauri/target/release/bundle/dmg
          xcrun notarytool submit \
            --apple-id ${{ secrets.APPLE_ID }} \
            --password ${{ secrets.APPLE_PASSWORD }} \
            --team-id ${{ secrets.APPLE_TEAM_ID }} \
            --file tachyon-${{ needs.prepare-deployment.outputs.version }}.dmg \
            --wait

  build-web-assets:
    name: Build Web Assets
    runs-on: ubuntu-latest
    needs: prepare-deployment
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}-${{ hashFiles('package-lock.json') }}

      - name: Install Dependencies
        run: |
          cd tachyon/web
          bun install

      - name: Build Web Bundle
        run: |
          cd tachyon/web
          bun run build

      - name: Generate SBOM
        run: |
          cd tachyon/web
          cargo-bom \
            --format spdx-json \
            --output sbom-web-${{ needs.prepare-deployment.outputs.version }}.spdx

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-server
    steps:
      - name: Scan Docker Image
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --output json \
            ghcr.io/tachyon/tachyon-server:${{ needs.prepare-deployment.outputs.image_tag }} \
            > trivy-results.json

      - name: Check Results
        run: |
          if [ $(jq '.Results[] | select(.Severity == "CRITICAL") | length' trivy-results.json) -gt 0 ]; then
            echo "ERROR: Critical vulnerabilities found"
            exit 1
          fi

  test-deployment:
    name: Test Deployment
    runs-on: ubuntu-latest
    needs: [build-server, build-desktop-packages, build-web-assets]
    steps:
      - name: Deploy to Development
        run: |
          helm upgrade --install tachyon-dev \
            --set image.tag=${{ needs.prepare-deployment.outputs.image_tag }} \
            --wait

      - name: Run Smoke Tests
        run: |
          ./scripts/smoke-tests.sh https://tachyon-dev.tachyon.io

      - name: Verify Health
        run: |
          curl -f https://tachyon-dev.tachyon.io/health/ready \
            --max-time 30

  promote-to-staging:
    name: Promote to Staging
    runs-on: ubuntu-latest
    needs: [test-deployment, security-scan]
    environment:
      ENVIRONMENT: staging
    if: github.event_name == 'workflow_dispatch' && github.event.client_payload.environment == 'staging'
    steps:
      - name: Tag Image for Staging
        run: |
          docker tag \
            ghcr.io/tachyon/tachyon-server:${{ needs.prepare-deployment.outputs.version }} \
            ${GITHUB_ENVIRONMENT}-staging

      - name: Deploy to Staging
        run: |
          helm upgrade --install tachyon-staging \
            --set image.tag=${{ needs.prepare-deployment.outputs.image_tag }}-staging \
            --wait

      - name: Canary Validation
        run: |
          ./scripts/monitor-canary.sh staging 30m

      - name: Manual Approval
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ secrets.GITHUB_TOKEN }}
        approvers: |
          - name: CTO
            login: cto
          - name: Engineering Manager
            login: engineering-manager
          required-approver-count: 1

      - name: Promote Canary
        if: github.event_name == 'workflow_dispatch' && github.event.client_payload.action == 'promote'
        run: |
          kubectl argo rollouts promote tachyon-server \
            -n staging

      - name: Monitor Canary
        run: |
          ./scripts/monitor-deployment.sh staging 30m

  deploy-to-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [promote-to-staging, security-scan]
    environment:
      ENVIRONMENT: production
    if: github.event_name == 'workflow_dispatch' && github.event.client_payload.environment == 'production'
    steps:
      - name: Tag Image for Production
        run: |
          docker tag \
            ghcr.io/tachyon/tachyon-server:${{ needs.prepare-deployment.outputs.version }} \
            production

      - name: Deploy to Green Environment
        run: |
          helm upgrade --install tachyon-green \
            --set image.tag=${{ needs.prepare-deployment.outputs.image_tag }}-green \
            --wait

      - name: Run Integration Tests
        run: |
          ./scripts/integration-tests.sh https://green.tachyon.io

      - name: Verify Green Health
        run: |
          curl -f https://green.tachyon.io/health/ready \
            --max-time 30

      - name: Route Internal Traffic to Green
        run: |
          kubectl patch service tachyon-server-preview \
            -n production \
            -p '{"spec":{"selector":{"version":"'${{ needs.prepare-deployment.outputs.version }}'"}}}'

      - name: Monitor Internal Traffic
        run: |
          ./scripts/monitor-deployment.sh green 15m

      - name: Manual Approval
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ secrets.GITHUB_TOKEN }}
        approvers: |
          - name: CTO
            login: cto
          - name: Engineering Manager
            login: engineering-manager
          - name: Security Lead
            login: security-lead
          required-approver-count: 3

      - name: Gradual Traffic Shift
        run: |
          kubectl patch service tachyon-server-active \
            -n production \
            -p '{"spec":{"selector":{"version":"'${{ needs.prepare-deployment.outputs.version }}'"}}}'

      - name: Verify Production Health
        run: |
          curl -f https://tachyon.io/health/ready \
            --max-time 30

      - name: Maintain Blue for 24 Hours
        run: |
          echo "Blue environment maintained for 24 hours for rollback capability"

  rollback-if-needed:
    name: Rollback if Needed
    runs-on: ubuntu-latest
    needs: [deploy-to-production]
    if: github.event_name == 'workflow_dispatch' && github.event.client_payload.action == 'rollback'
    environment:
      ENVIRONMENT: production
    steps:
      - name: Rollback to Blue
        run: |
          kubectl patch service tachyon-server-active \
            -n production \
            -p '{"spec":{"selector":{"version":"'${{ needs.prepare-deployment.outputs.previous_version }}'"}}}'

      - name: Verify Rollback
        run: |
          kubectl get pods -n production -l version=${{ needs.prepare-deployment.outputs.previous_version }} -o jsonpath='{.items[*].status.conditions[?(@.type=="Ready")].status}'

  notify-success:
    name: Notify Success
    runs-on: ubuntu-latest
    needs: [deploy-to-production, rollback-if-needed]
    if: github.event_name == 'workflow_dispatch' && github.event.client_payload.action != 'rollback'
    steps:
      - name: Send Deployment Notification
        uses: actions/github-script@v7
        with:
          script: |
            gh api graphql -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -f query='
                mutation($input: $input) {
                  createIssue(input: {repositoryOwner: "tachyon", repositoryName: "Tachyon", title: "Deployment Completed: ${{ needs.prepare-deployment.outputs.version }}", body: "Version ${{ needs.prepare-deployment.outputs.version }} deployed successfully to ${{ github.event.client_payload.environment }}") {
                    addLabelsToLabelableId(input: {labelableId: "LAU", labels: ["deployment", "success"]})
                  }
                }
              '

  notify-failure:
    name: Notify Failure
    runs-on: ubuntu-latest
    if: failure()
    needs: [deploy-to-production, rollback-if-needed]
    steps:
      - name: Send Failure Notification
        uses: actions/github-script@v7
        with:
          script: |
            gh api graphql -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -f query='
                mutation($input: $input) {
                  createIssue(input: {repositoryOwner: "tachyon", repositoryName: "Tachyon", title: "Deployment Failed: ${{ needs.prepare-deployment.outputs.version }}", body: "Deployment failed. Please check logs.", labels: ["deployment", "failure", "critical"]) {
                    }
                }
              '

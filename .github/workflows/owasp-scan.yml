name: OWASP ZAP Scan

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  zap-baseline:
    name: ZAP Baseline Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tachyon
          POSTGRES_PASSWORD: tachyon
          POSTGRES_DB: tachyon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tachyon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build Tachyon server image
        run: docker build -f Dockerfile -t tachyon/server:zap-scan .

      - name: Run Tachyon server
        run: |
          docker network create tachyon-net

          docker run -d \
            --name tachyon-server \
            --network tachyon-net \
            -p 8080:8080 \
            -e DATABASE_URL=postgres://tachyon:tachyon@172.17.0.1:5432/tachyon \
            -e JWT_SECRET=zap-scan-test-secret-change-me \
            -e TACHYON_JWT_SECRETS=zap-scan-test-secret-change-me \
            -e TACHYON_JWT_ISSUER=tachyon \
            -e TACHYON_JWT_AUDIENCE=tachyon-api \
            -e TACHYON_RATE_LIMIT_ENABLED=false \
            -e RUST_LOG=info \
            -e REDIS_URL=redis://172.17.0.1:6379 \
            -e SERVER_HOST=0.0.0.0 \
            -e SERVER_PORT=8080 \
            tachyon/server:zap-scan

      - name: Wait for server readiness
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
              echo "Server is ready"
              exit 0
            fi
            echo "Waiting for server... attempt $i/30"
            sleep 2
          done
          echo "Server failed to start"
          docker logs tachyon-server
          exit 1

      - name: Run ZAP API spec import
        run: |
          mkdir -p zap-report

          docker run --rm \
            --network host \
            -v $(pwd)/zap-report:/zap/wrk:rw \
            zaproxy/zap-stable \
            zap-api-scan.py \
            -t http://host.docker.internal:8080/api/v1 \
            -f openapi \
            -d \
            -r zap-baseline-report.html \
            -w zap-baseline-report.md \
            -J zap-baseline-report.json \
            -z "-config globalexcludeurl.url_list.url\(0\).regex='.*/health.*' \
                -config globalexcludeurl.url_list.url\(0\).description='Health endpoints' \
                -config globalexcludeurl.url_list.url\(0\).enabled=true \
                -config globalexcludeurl.url_list.url\(1\).regex='.*/ready.*' \
                -config globalexcludeurl.url_list.url\(1\).description='Readiness endpoints' \
                -config globalexcludeurl.url_list.url\(1\).enabled=true" || true

      - name: Check for HIGH/CRITICAL findings
        run: |
          if [ ! -f zap-report/zap-baseline-report.json ]; then
            echo "No ZAP report generated - scanning may have had connectivity issues"
            exit 0
          fi

          python3 -c '
          import json, sys
          with open("zap-report/zap-baseline-report.json") as f:
            data = json.load(f)
          high_critical = []
          for site in data.get("site", []):
            for alert in site.get("alerts", []):
              risk = alert.get("riskdesc", "").split(" ")[0] if "riskdesc" in alert else ""
              riskcode = alert.get("riskcode", "0")
              if riskcode in ("3", "4") or risk in ("High", "Critical"):
                high_critical.append({
                  "name": alert.get("alert"),
                  "risk": alert.get("riskdesc"),
                  "url": alert.get("instances", [{}])[0].get("uri", "unknown") if alert.get("instances") else "unknown"
                })
          if high_critical:
            print(f"Found {len(high_critical)} HIGH/CRITICAL vulnerabilities:")
            for v in high_critical:
              print(f"  [{v[\"risk\"]}] {v[\"name\"]} at {v[\"url\"]}")
            sys.exit(1)
          else:
            print("No HIGH/CRITICAL vulnerabilities found")
          '

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zap-baseline-report
          path: zap-report/
          retention-days: 30

      - name: Cleanup
        if: always()
        run: |
          docker stop tachyon-server || true
          docker rm tachyon-server || true
          docker network rm tachyon-net || true

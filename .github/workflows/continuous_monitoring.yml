# Tachyon Continuous Monitoring Workflow
# Phase: 11 - Continuous Monitoring
# Triggers: Daily, Weekly, On Push/Pull Request

name: Continuous Monitoring

on:
  # Daily scheduled run at 02:00 UTC
  - cron: '0 2 * * *'
  
  # On push and pull request to main/develop
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  standards_updates:
    name: Standards Updates Monitoring
    runs-on: ubuntu-latest
    if: github.event == 'schedule' || github.event == 'push' || github.event == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run standards scrapers
        run: |
          cargo run --bin standards-scraper

      - name: Check for standard updates
        run: |
          if [ -f "standards_updates.json" ]; then
            echo "Standard updates detected"
            else
            echo "No standard updates"

      - name: Generate alerts if needed
        if: always()
        run: |
          cargo run --bin alert-generator

  compliance_monitoring:
    name: Compliance Monitoring
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run compliance validator
        run: |
          cargo run --bin compliance-validator

      - name: Check compliance score
        run: |
          SCORE=$(cargo run --bin compliance-checker)
          echo "Compliance score: $SCORE"

      - name: Alert on non-compliance
        if: failure()
        run: |
          echo "Compliance below threshold"

  performance_monitoring:
    name: Performance Monitoring
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run performance metrics collector
        run: |
          cargo run --bin metrics-collector

      - name: Check for regressions
        run: |
          cargo run --bin regression-detector

      - name: Alert on regressions
        if: always()
        run: |
          cargo run --bin alert-generator

  security_monitoring:
    name: Security Monitoring
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run SAST scanner
        run: |
          cargo semgrep --config .semgrep.yml --error .

      - name: Run SCA scanner
        run: |
          cargo snyk test --json > snyk-results.json

      - name: Run vulnerability checker
        run: |
          cargo audit --json > audit-results.json

      - name: Upload security results
        uses: actions/upload-artifact@v3
        with:
          name: security-results
          path: |
            snyk-results.json
            audit-results.json

      - name: Alert on vulnerabilities
        if: always()
        run: |
          cargo run --bin security-alert-generator

  supply_chain_monitoring:
    name: Supply Chain Monitoring
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate SBOM
        run: |
          cargo run --bin sbom-generator

      - name: Verify SBOM
        run: |
          cargo run --bin sbom-verifier

      - name: Check license compliance
        run: |
          cargo run --bin license-scanner

      - name: Alert on supply chain issues
        if: always()
        run: |
          cargo run --bin supply-chain-alert-generator

  reporting:
    name: Generate Reports
    runs-on: ubuntu-latest
    needs: [standards_updates, compliance_monitoring, performance_monitoring, security_monitoring, supply_chain_monitoring]
    if: github.event == 'schedule' && github.event.schedule == '0 2 * * *'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate daily summary
        run: |
          cargo run --bin report-generator --type daily

      - name: Upload reports
        uses: actions/upload-artifact@v3
        with:
          name: daily-reports
          path: reports/daily/

      - name: Notify recipients
        run: |
          cargo run --bin report-notifier --type daily

      - name: Store reports in S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws s3 sync reports/daily/ s3://tachyon-reports/continuous-monitoring/daily/

  weekly_reports:
    name: Generate Weekly Reports
    runs-on: ubuntu-latest
    needs: [standards_updates, compliance_monitoring, performance_monitoring, security_monitoring, supply_chain_monitoring]
    if: github.event == 'schedule' && github.event.schedule == '0 9 * * 1'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate weekly report
        run: |
          cargo run --bin report-generator --type weekly

      - name: Upload reports
        uses: actions/upload-artifact@v3
        with:
          name: weekly-reports
          path: reports/weekly/

      - name: Notify recipients
        run: |
          cargo run --bin report-notifier --type weekly

      - name: Store reports in S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws s3 sync reports/weekly/ s3://tachyon-reports/continuous-monitoring/weekly/

  monthly_reports:
    name: Generate Monthly Reports
    runs-on: ubuntu-latest
    needs: [standards_updates, compliance_monitoring, performance_monitoring, security_monitoring, supply_chain_monitoring]
    if: github.event == 'schedule' && github.event.schedule == '0 9 1 * *'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate monthly report
        run: |
          cargo run --bin report-generator --type monthly

      - name: Upload reports
        uses: actions/upload-artifact@v3
        with:
          name: monthly-reports
          path: reports/monthly/

      - name: Notify recipients
        run: |
          cargo run --bin report-notifier --type monthly

      - name: Store reports in S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws s3 sync reports/monthly/ s3://tachyon-reports/continuous-monitoring/monthly/

  cleanup:
    name: Cleanup old reports
    runs-on: ubuntu-latest
    if: github.event == 'schedule' && github.event.schedule == '0 8 1 * *'
    steps:
      - name: Cleanup reports older than 30 days
        run: |
          cargo run --bin report-cleanup --days 30

      - name: Archive old reports
        run: |
          cargo run --bin report-archiver --days 30

      - name: Archive to long-term storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws s3 sync s3://tachyon-reports-archive/ s3://tachyon-long-term-archive/

version: "3.8"
services:
  app:
    build: .
    ports:
      - "3000:8080"
    environment:
      DATABASE_URL: postgres://tachyon:tachyon@db:5432/tachyon
      JWT_SECRET: dev-secret-change-in-production
      RUST_LOG: info
      REDIS_URL: redis://redis:6379
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tachyon
      POSTGRES_PASSWORD: tachyon
      POSTGRES_DB: tachyon
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tachyon"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

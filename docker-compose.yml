version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: tachyon/server:${VERSION:-latest}
    container_name: tachyon-backend
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - DATABASE_URL=postgres://tachyon:${POSTGRES_PASSWORD:-tachyon}@postgres:5432/tachyon
      - DATABASE_PATH=/data/tachyon.db
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-86400}
      - REDIS_URL=redis://redis:6379
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
    volumes:
      - tachyon-data:/data
      - tachyon-logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - tachyon-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: tachyon/frontend:${VERSION:-latest}
    container_name: tachyon-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      - API_URL=http://backend:8080
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - tachyon-network
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    container_name: tachyon-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=tachyon
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-tachyon}
      - POSTGRES_DB=tachyon
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tachyon -d tachyon"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tachyon-network

  redis:
    image: redis:7-alpine
    container_name: tachyon-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tachyon-network

  nginx:
    image: nginx:alpine
    container_name: tachyon-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl.conf:/etc/nginx/ssl.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx-logs:/var/log/nginx
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - tachyon-network
    depends_on:
      - backend
      - frontend

volumes:
  tachyon-data:
    driver: local
  tachyon-logs:
    driver: local
  postgres-data:
    driver: local
  redis-data:
    driver: local
  nginx-logs:
    driver: local

networks:
  tachyon-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

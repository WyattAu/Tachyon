[workspace]
#members = ["crates/core", "crates/server", "crates/desktop"]
resolver = "2"
members = ["crates/core", "crates/server"]

[workspace.dependencies]
# Async Runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error Handling & Logging
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

# Core Logic
git2 = "0.18"
rusqlite = { version = "0.29", features = ["bundled"] } # Bundled is crucial for Windows
tantivy = "0.21"
pulldown-cmark = { version = "0.9", features = ["simd"] }
#minijinja = { version = "1", features = ["source"] }
dashmap = "5"
walkdir = "2"

# Server Logic
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
notify = "6"
rust-embed = "8"
clap = { version = "4", features = ["derive"] }

# Desktop Logic
tauri = { version = "2.0.0-beta", features = [] }
tauri-build = { version = "2.0.0-beta", features = [] }

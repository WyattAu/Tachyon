[workspace]
members = ["crates/core", "crates/server", "crates/desktop", "crates/desktop/src-tauri", "crates/renderer", "crates/rbac", "crates/search", "crates/database", "crates/testing", "crates/cli", "crates/frontend"]
resolver = "2"
package.version = "0.1.0"
package.edition = "2021"
package.rust-version = "1.75"

[workspace.dependencies]
# Async Runtime
tokio = { version = "1", features = ["full"] }
bytes = "1.11.1"  # Pinned for security fix (RUSTSEC-2026-0007)

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error Handling & Logging
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "1"

# Date/Time Handling
chrono = { version = "0.4", features = ["serde"] }

# UUID generation
uuid = { version = "1", features = ["v4", "serde"] }

# Core Logic
git2 = "0.18"
rusqlite = { version = "0.29", features = ["bundled"] } # Bundled is crucial for Windows
tantivy = "0.25"
pulldown-cmark = { version = "0.9", features = ["simd"] }
#minijinja = { version = "1", features = ["source"] }
dashmap = "5"
walkdir = "2"

# Server Logic
axum = { version = "0.7", features = ["macros", "ws"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
axum-tungstenite = { version = "0.3", default-features = false }
notify = "6"
rust-embed = "8"
clap = { version = "4", features = ["derive"] }

# Desktop Logic
tauri = { version = "2.0.0-beta", features = [] }
tauri-build = { version = "2.0.0-beta", features = [] }

# Testing
proptest = "1.4"
mockall = "0.12"
testcontainers = "0.15"
testcontainers-modules = { version = "0.3", features = ["postgres", "redis"] }
wiremock = "0.5"
serial_test = "3.0"
tokio-test = "0.4"
criterion = "0.5"
cargo-fuzz = "0.11"
rand = "0.8"
quickcheck = "1.0"

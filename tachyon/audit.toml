# cargo-audit configuration
# https://github.com/rustsec/rustsec/tree/main/cargo-audit

[advisories]
# RUSTSEC-2023-0071: rsa Marvin Attack timing sidechannel
# Transitive dependency via sqlx-mysql -> rsa. No fixed version available.
# We use PostgreSQL, not MySQL, so this code path is never exercised.
# The rsa crate is only compiled when the "mysql" feature of sqlx is enabled,
# which is not the case in our default feature set.
ignored = ["RUSTSEC-2023-0071"]

[targets]
# Only audit for our actual target platforms
x86_64-unknown-linux-gnu = true
wasm32-unknown-unknown = true

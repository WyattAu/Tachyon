<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Tachyon - Knowledge Management System">
  <meta name="theme-color" content="#ffffff">
  <title>Tachyon</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script src="https://unpkg.com/htmx.org@2.0.8"></script>
</head>
<body class="h-full bg-gray-50 dark:bg-gray-900">
  <div id="app" class="min-h-full">
    <!-- Navigation -->
    <nav class="bg-white dark:bg-gray-800 shadow-sm">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16">
          <div class="flex">
            <a href="/" class="flex items-center">
              <span class="text-xl font-bold text-blue-600 dark:text-blue-400">Tachyon</span>
            </a>
            <div class="hidden sm:ml-6 sm:flex sm:space-x-8">
              <a href="/" class="nav-link">Dashboard</a>
              <a href="/documents" class="nav-link">Documents</a>
              <a href="/repositories" class="nav-link" data-auth-required>Repositories</a>
            </div>
          </div>
          <div class="flex items-center gap-4">
            <!-- Search -->
            <div class="relative" id="search">
              <input 
                type="text" 
                id="search-input"
                placeholder="Search... (Ctrl+K)"
                class="input w-64"
              >
              <div id="search-results" class="search-results hidden"></div>
            </div>
            
            <!-- Theme toggle -->
            <button id="theme-toggle" class="btn-ghost p-2">
              <span id="theme-toggle-icon">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                </svg>
              </span>
            </button>
            
            <!-- User menu -->
            <div data-dropdown class="relative" data-auth-required>
              <button data-dropdown-toggle class="btn-ghost">
                <span data-user-name>Guest</span>
              </button>
              <div data-dropdown-content class="dropdown-content hidden">
                <a href="/profile" class="dropdown-item">Profile</a>
                <a href="/settings" class="dropdown-item">Settings</a>
                <hr class="my-1 border-gray-200 dark:border-gray-700">
                <button id="logout-button" class="dropdown-item w-full text-left text-red-600">Logout</button>
              </div>
            </div>
            
            <!-- Login button -->
            <a href="/login" class="btn-primary" data-guest-only>Sign In</a>
          </div>
        </div>
      </div>
    </nav>

    <!-- Main content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <!-- Editor -->
      <div id="editor" class="editor-container">
        <!-- Editor will be initialized here -->
      </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 mt-auto">
      <div class="max-w-7xl mx-auto px-4 py-4 text-center text-sm text-gray-500">
        <p>Tachyon - Knowledge Management System</p>
      </div>
    </footer>
  </div>

  <script type="module" src="/src/index.ts"></script>
</body>
</html>

[package]
name = "tachyon-editor"
version = "0.1.0"
license = { workspace = true }
edition.workspace = true
description = "Native Rust text editor engine for Tachyon"

[dependencies]
once_cell = "1"
ropey = "1.6"
unicode-segmentation = "1.12"
regex = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "1"
tracing = "0.1"
yrs = "0.25"

[features]
staging = []

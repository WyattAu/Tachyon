[package]
name = "tachyon-import-export"
version = "0.1.0"
license = { workspace = true }
description = "Import/export functionality for Tachyon knowledge management system"
edition = "2021"

[lib]
name = "tachyon_import_export"
path = "src/lib.rs"

[dependencies]
# Core
tachyon-core = { path = "../core" }
tachyon-renderer = { path = "../renderer" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Archive handling
zip = "2"

# File system
walkdir = "2"

# Error handling
thiserror = "1"
anyhow = "1"

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"

# Utilities
regex = "1"
uuid = { version = "1", features = ["v4", "v7"] }

# PDF generation (optional)
genpdf = { version = "0.2", features = ["images"], optional = true }
printpdf = { version = "0.3", optional = true }

# DOCX import/export (optional)
quick-xml = { version = "0.37", features = ["serialize"], optional = true }

[features]
pdf-export = ["dep:genpdf", "dep:printpdf"]
docx = ["dep:quick-xml"]

[dev-dependencies]
tempfile = "3"

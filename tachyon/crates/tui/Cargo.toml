[package]
name = "tachyon-tui"
version = "0.1.0"
edition = "2021"
description = "Terminal UI client for Tachyon knowledge management"

[dependencies]
tokio = { version = "1", features = ["full"] }
ratatui = "0.29"
crossterm = "0.28"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

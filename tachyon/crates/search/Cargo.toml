[package]
name = "tachyon-search"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Full-text search engine for Tachyon knowledge management system using Tantivy"
license = "MIT OR Apache-2.0"

[lib]
name = "tachyon_search"
path = "src/lib.rs"

[dependencies]
# Workspace dependencies
tachyon-core = { path = "../core" }
tachyon-rbac = { path = "../rbac" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# NOTE: anyhow removed — zero imports; uses custom SearchError
tracing = { workspace = true }

# Search Engine
tantivy = { workspace = true }

# Date/Time handling
chrono = { version = "0.4", features = ["serde"] }

# NOTE: thiserror removed — zero imports; SearchError is hand-rolled

# HTTP/WebSocket API (uses axum built-in WS)
axum = { workspace = true }
# NOTE: axum-tungstenite, tower, tower-http removed — zero imports; axum handles WS natively
futures-util = "0.3"

# NOTE: async-trait removed — zero imports; no #[async_trait] used

[features]
staging = []

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
proptest = { workspace = true }
criterion = { version = "0.5", features = ["html_reports"] }
tachyon-renderer = { path = "../renderer" }
tachyon-core = { path = "../core" }

[[bench]]
name = "search_bench"
harness = false
path = "benches/search_bench.rs"

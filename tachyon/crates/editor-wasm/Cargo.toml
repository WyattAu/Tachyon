[package]
name = "tachyon-editor-wasm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "WebAssembly bindings for the tachyon-editor model (SolidJS editor view core — ADR-113)"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

# The editor MODEL — one source of truth shared with the desktop/CLI.
# wasm32-safe: tree-sitter highlighting is optional in tachyon-editor and
# excluded on this target (see editor/Cargo.toml).
tachyon-editor = { path = "../editor" }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

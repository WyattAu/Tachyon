[package]
name = "tachyon-desktop-app"
version = "0.1.0"
description = "Tauri App for Tachyon desktop client"
authors = ["Tachyon Team"]
license = "MIT"
repository = "https://github.com/tachyon/tachyon"
edition = "2021"
rust-version = "1.75"

[lib]
name = "tachyon_desktop_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri framework
tauri = { version = "2.10.0", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"

# Workspace dependencies
tachyon-core = { path = "../../core" }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Async Runtime
tokio = { workspace = true }

# Error Handling & Logging
anyhow = { workspace = true }
tracing = { workspace = true }

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Git operations
git2 = { workspace = true }

# File system operations
walkdir = { workspace = true }

# Time handling
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }

# Hashing for local authentication
sha2 = "0.10"
hex = "0.4"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

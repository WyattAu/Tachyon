[package]
name = "tachyon-server"
version = "0.1.0"
description = "JIT documentation server for Tachyon knowledge management system"
edition = "2021"

[lib]
name = "tachyon_server"
path = "src/lib.rs"

[dependencies]
# Core libraries
tachyon-core = { path = "../core" }
tachyon-rbac = { path = "../rbac" }
tachyon-database = { path = "../database" }
tachyon-renderer = { path = "../renderer" }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json"] }

# Async Runtime
tokio = { version = "1", features = ["full"] }

# HTTP Server
axum = { version = "0.8", features = ["tracing", "macros", "ws", "multipart"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-full", "limit"] }

# WebSocket
tokio-tungstenite = "0.26"
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Authentication
jsonwebtoken = "9"

# Error Handling & Logging
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"

# Validation & Security
regex = "1"
url = "2"
html-escape = "0.2"
sha2 = "0.10"

# OpenAPI Documentation
utoipa = "5"
utoipa-swagger-ui = { version = "9", features = ["axum"] }

[dev-dependencies]
tokio-test = { workspace = true }
wiremock = { workspace = true }
serial_test = { workspace = true }
pretty_assertions = "1.4"
assert_matches = "1.5"

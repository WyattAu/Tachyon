[package]
name = "tachyon_server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum.workspace = true
leptos = "0.8.15"
leptos_axum = "0.8.7"
leptos_meta = "0.8.5"
leptos_router = "0.8.11"
tachyon_core = { version = "0.1.0", path = "../core" }
tokio = { workspace = true, features = ["full"] }
tower-http.workspace = true
wasm-bindgen = "0.2.108"

[lib]
crate-type = ["cdylib", "rlib"]
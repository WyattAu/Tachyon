[package]
name = "tachyon-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Command-line interface for Tachyon knowledge base system"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tachyon-kb/tachyon"
readme = "../../README.md"
keywords = ["cli", "tachyon", "knowledge-base"]
categories = ["command-line-utilities"]

[[bin]]
name = "tachyon"
path = "src/main.rs"

[dependencies]
# Workspace dependencies
tachyon-core = { path = "../core" }
tachyon-server = { path = "../server" }
tachyon-desktop = { path = "../desktop" }
tachyon-renderer = { path = "../renderer" }
tachyon-rbac = { path = "../rbac" }
tachyon-search = { path = "../search" }
tachyon-database = { path = "../database" }

# CLI framework
clap = { workspace = true }

# Async runtime
tokio = { workspace = true }

# Error handling and logging
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"

# Date/Time handling
chrono = { workspace = true }

# Git operations
git2 = { workspace = true }

# File system operations
walkdir = { workspace = true }

# HTTP server
axum = { workspace = true }
tower-http = { workspace = true }

# Desktop
tauri = { workspace = true }

[dev-dependencies]
tempfile = "3"

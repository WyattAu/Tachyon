[package]
name = "tachyon-renderer"
version.workspace = true
edition = "2021"
rust-version = "1.75"
description = "Document rendering engine for Tachyon"
license = "MIT OR Apache-2.0"

[dependencies]
# Core dependencies
tachyon-core = { path = "../core" }

# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"

# Error handling & Logging
anyhow = { workspace = true }
thiserror = "2"
tracing = { workspace = true }

# Markdown parsing
pulldown-cmark = { workspace = true, features = [
    "simd",
    "serde",
] }

# Template engine
minijinja = { version = "2", features = [
    "loader",
    "debug",
    "preserve_order",
] }

# Syntax highlighting
tree-sitter = "0.25"
tree-sitter-highlight = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-toml = "0.20"
tree-sitter-yaml = "0.7"
tree-sitter-css = "0.25"
tree-sitter-sql = "0.0"
tree-sitter-bash = "0.25"
tree-sitter-json = "0.21"
tree-sitter-html = "0.23"
tree-sitter-markdown = "0.7"

# LaTeX rendering
katex = { version = "0.2", default-features = false }

# HTML sanitization
ammonia = "4"

# Wikilink parsing
regex = "1"

# Caching
lru = "0.12"
parking_lot = "0.12"

# Hashing
sha2 = "0.10"

# Time handling
time = { version = "0.3", features = ["serde", "formatting"] }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "renderer_bench"
harness = false
path = "benches/renderer_bench.rs"

[features]
staging = []

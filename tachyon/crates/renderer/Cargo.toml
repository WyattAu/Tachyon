[package]
name = "tachyon-renderer"
version.workspace = true
rust-version.workspace = true
description = "Document rendering engine for Tachyon"
license = "MIT OR Apache-2.0"
edition.workspace = true

[dependencies]
# Core dependencies
tachyon-core = { path = "../core" }

# Published docs pipeline: markdown rendering, syntax highlighting,
# sanitization, LaTeX, and embeds. This crate re-exports it as a thin layer
# and adds Tachyon-specific caching and templating.
docs-pipeline = { path = "../../../../docs-pipeline" }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling & Logging
thiserror.workspace = true
tracing = { workspace = true }

# Template engine
minijinja = { version = "2", features = [
    "loader",
    "debug",
    "preserve_order",
] }

# Caching
lru = ">=0.12.5, <0.13"
parking_lot = "0.12"

# Hashing
sha2 = "0.10"

# Time handling
time = { version = "0.3", features = ["serde", "formatting"] }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "renderer_bench"
harness = false
path = "benches/renderer_bench.rs"

[features]
staging = []

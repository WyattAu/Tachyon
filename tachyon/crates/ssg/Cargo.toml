[package]
name = "tachyon-ssg"
version = "0.1.0"
license = { workspace = true }
edition.workspace = true
description = "Static site generator for Tachyon knowledge base"

[[bin]]
name = "tachyon-ssg-cli"
path = "src/bin/ssg_cli.rs"

[dependencies]
tachyon-core = { path = "../core" }
tachyon-renderer = { path = "../renderer" }
tachyon-import-export = { path = "../import-export" }
docs-pipeline = { path = "../../../../docs-pipeline" }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Date/Time
chrono = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
uuid = { workspace = true }
clap = { version = "4", features = ["derive"] }
walkdir = "2"

# ZIP archive support
zip = "2"

# Parser libraries
serde_yaml = "0.9"
toml = "0.8"

# Regex for TOC extraction
regex = "1"

# File watching (for serve command)
notify = { workspace = true }

# Image optimization
media-kit = { workspace = true }

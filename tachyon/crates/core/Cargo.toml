[package]
name = "tachyon-core"
version = "0.1.0"
license = { workspace = true }
description = "Core library for Tachyon knowledge management system"
edition = "2021"

[lib]
name = "tachyon_core"
path = "src/lib.rs"

[dependencies]
# Async Runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error Handling & Logging
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "1"

# Core Logic
git2 = { version = "0.20", features = ["vendored-openssl", "vendored-libgit2"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Authentication
argon2 = "0.5"
rand = "0.8"

# File System Monitoring
notify = "6.0"

# Markdown Processing
pulldown-cmark = { version = "0.9", features = ["simd"] }

# Hashing
sha2 = "0.10"

# CRDT (base64 encoding for binary Yjs updates)
base64 = "0.22"

# Utilities
dashmap = "5"
walkdir = "2"
regex = "1.11"
once_cell = "1.18"

[dev-dependencies]
proptest = { workspace = true }
# For testing only

[build]
target = "index.html"
dist = "dist"
public_url = "/"

[tools]
# wasm-opt is auto-detected from PATH by trunk. On CI, binaryen is not
# installed, so trunk will skip the optimization step automatically.

[watch]
watch = ["src/", "public/"]
ignore = ["dist/"]

[serve]
addresses = ["127.0.0.1"]
port = 8080
no-error-on-404 = true

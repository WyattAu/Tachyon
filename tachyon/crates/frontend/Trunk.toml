[build]
target = "index.html"
dist = "dist"
public_url = "/"

[tools]
# Disable wasm-opt: trunk auto-downloads binaryen but its version may be
# incompatible with WASM bulk-memory operations generated by wasm-bindgen.
# Setting to null prevents the download entirely.

[watch]
watch = ["src/", "public/"]
ignore = ["dist/"]

[serve]
addresses = ["127.0.0.1"]
port = 8080
no-error-on-404 = true

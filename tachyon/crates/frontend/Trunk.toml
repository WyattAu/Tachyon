[build]
target = "index.html"
dist = "dist"
public_url = "/"

[tools]
# Explicitly set wasm-opt to empty string to disable the optimization step.
# Trunk auto-downloads binaryen when wasm_opt is not set, but its
# bundled version may be incompatible with bulk-memory WASM features.
wasm_opt = ""

[watch]
watch = ["src/", "public/"]
ignore = ["dist/"]

[serve]
addresses = ["127.0.0.1"]
port = 8080
no-error-on-404 = true

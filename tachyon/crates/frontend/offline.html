<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tachyon — Offline</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #111827;
      color: #f3f4f6;
    }
    .container { text-align: center; padding: 2rem; }
    h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    p { color: #9ca3af; margin-bottom: 1.5rem; }
    button {
      background: #3B82F6; color: white; border: none; padding: 0.75rem 1.5rem;
      border-radius: 0.5rem; cursor: pointer; font-size: 1rem;
    }
    button:hover { background: #2563EB; }
  </style>
</head>
<body>
  <div class="container">
    <h1>You're Offline</h1>
    <p>Tachyon is not available right now. Check your internet connection and try again.</p>
    <button onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>

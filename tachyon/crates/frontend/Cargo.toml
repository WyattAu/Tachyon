[package]
name = "tachyon-frontend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Leptos-based frontend for Tachyon knowledge management system"
authors = ["Tachyon Team"]
license = "MIT"

[lib]
name = "tachyon_frontend"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

# Note: Frontend is built with trunk for WASM output
# The binary target is not needed for CSR mode

[dependencies]
# Workspace dependencies
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true, features = ["wasmbind"] }

# Leptos framework - CSR (Client-Side Rendering) mode
leptos = { version = "0.8", features = ["csr"] }
leptos_router = { version = "0.8" }
leptos_meta = { version = "0.8" }

# HTTP client for API calls
gloo-net = { version = "0.6", features = ["json", "websocket"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "EventTarget",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "HtmlDivElement",
    "HtmlAnchorElement",
    "HtmlButtonElement",
    "Navigator",
    "Window",
    "Storage",
    "Blob",
    "BlobPropertyBag",
    "File",
    "FileList",
    "DataTransfer",
    "DragEvent",
    "KeyboardEvent",
    "MouseEvent",
    "Url",
] }
js-sys = "0.3"

# WASM utilities
console_error_panic_hook = "0.1"
log = "0.4"
wasm-logger = "0.2"

# UUID - with js feature for WASM support
uuid = { version = "1.11", features = ["v4", "serde", "js"] }

# WASM-compatible time
time = { version = "0.3", features = ["wasm-bindgen"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document", "Element"] }
console_log = "1.0"
pretty_assertions = "1.4"

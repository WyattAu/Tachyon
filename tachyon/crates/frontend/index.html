<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tachyon - A deterministic, high-performance knowledge management system with sub-15ms rendering and real-time collaboration.">
    <meta name="theme-color" content="#2563eb">
    <title>Tachyon - Knowledge Management System</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                        mono: ['JetBrains Mono', 'Fira Code', 'Consolas', 'monospace'],
                    },
                    typography: {
                        DEFAULT: {
                            css: {
                                maxWidth: 'none',
                            },
                        },
                    },
                },
            },
            plugins: [
                // Prose classes for document rendering
                function({ addUtilities }) {
                    const newUtilities = {
                        '.prose': {
                            'color': '#374151',
                            'line-height': '1.75',
                            'max-width': '65ch',
                        },
                        '.prose-sm': {
                            'font-size': '0.875rem',
                            'line-height': '1.7142857',
                        },
                    }
                    addUtilities(newUtilities)
                },
            ],
        }
    </script>
    <style type="text/tailwindcss">
        @layer base {
            html {
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }
            body {
                @apply bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100;
            }
            ::-webkit-scrollbar {
                width: 8px;
                height: 8px;
            }
            ::-webkit-scrollbar-track {
                background: transparent;
            }
            ::-webkit-scrollbar-thumb {
                @apply bg-gray-300 dark:bg-gray-600 rounded;
            }
            ::-webkit-scrollbar-thumb:hover {
                @apply bg-gray-400 dark:bg-gray-500;
            }
        }
    </style>
    <style>
        @media print {
            nav, .no-print, button, input, textarea, select,
            .sidebar, .toolbar, .command-palette {
                display: none !important;
            }
            main, .content, article {
                width: 100% !important;
                max-width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
            }
            body {
                font-size: 12pt;
                line-height: 1.6;
                color: #000;
                background: #fff;
            }
            a[href]::after {
                content: " (" attr(href) ")";
                font-size: 0.8em;
                color: #666;
            }
            h1, h2, h3, h4 {
                page-break-after: avoid;
            }
            img, figure {
                page-break-inside: avoid;
            }
        }
    </style>
    <link data-trunk rel="rust" data-target-name="tachyon_frontend" data-wasm-opt="z">
    <base data-trunk-public-url>
    <!-- ProseMirror editor bundle (built from editor/ via `npm run build`) -->
    <script src="editor.js"></script>
    <script>
        // Tauri desktop detection and API URL configuration.
        // When running inside Tauri, the __TAURI__ global is injected.
        // The frontend's ApiClient reads window.tachyonApiUrl to determine
        // the backend API base URL. In desktop mode, we default to the
        // local server but allow configuration via Tauri's IPC commands.
        (function() {
            if (window.__TAURI__) {
                window.__TACHYON_DESKTOP__ = true;
                // In desktop mode, the user runs `tachyon serve` on the default port.
                // If not set by the user, default to the local server.
                if (!window.tachyonApiUrl) {
                    window.tachyonApiUrl = 'http://localhost:8080/api/v1';
                }
            }
        })();
    </script>
</head>
<body>
    <div id="app"></div>
</body>
</html>

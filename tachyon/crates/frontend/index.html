<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tachyon - A deterministic, high-performance knowledge management system with sub-15ms rendering and real-time collaboration.">
    <meta name="theme-color" content="#2563eb">
    <title>Tachyon - Knowledge Management System</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="dns-prefetch" href="//localhost:8080">
    <link rel="preconnect" href="//localhost:8080" crossorigin>
    <link rel="preload" href="./tachyon_frontend_bg.wasm" as="fetch" crossorigin>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                        mono: ['JetBrains Mono', 'Fira Code', 'Consolas', 'monospace'],
                    },
                    typography: {
                        DEFAULT: {
                            css: {
                                maxWidth: 'none',
                            },
                        },
                    },
                },
            },
            plugins: [
                // Prose classes for document rendering
                function({ addUtilities }) {
                    const newUtilities = {
                        '.prose': {
                            'color': '#374151',
                            'line-height': '1.75',
                            'max-width': '65ch',
                        },
                        '.prose-sm': {
                            'font-size': '0.875rem',
                            'line-height': '1.7142857',
                        },
                    }
                    addUtilities(newUtilities)
                },
            ],
        }
    </script>
    <style type="text/tailwindcss">
        @layer base {
            html {
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }
            body {
                @apply bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100;
            }
            ::-webkit-scrollbar {
                width: 8px;
                height: 8px;
            }
            ::-webkit-scrollbar-track {
                background: transparent;
            }
            ::-webkit-scrollbar-thumb {
                @apply bg-gray-300 dark:bg-gray-600 rounded;
            }
            ::-webkit-scrollbar-thumb:hover {
                @apply bg-gray-400 dark:bg-gray-500;
            }
        }
    </style>
    <style>
        @media print {
            nav, .no-print, button, input, textarea, select,
            .sidebar, .toolbar, .command-palette {
                display: none !important;
            }
            main, .content, article {
                width: 100% !important;
                max-width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
            }
            body {
                font-size: 12pt;
                line-height: 1.6;
                color: #000;
                background: #fff;
            }
            a[href]::after {
                content: " (" attr(href) ")";
                font-size: 0.8em;
                color: #666;
            }
            h1, h2, h3, h4 {
                page-break-after: avoid;
            }
            img, figure {
                page-break-inside: avoid;
            }
        }
    </style>
    <style>
        /* ── Native Editor ── */
        .native-editor {
            position: relative;
            overflow: auto;
            background-color: #030712;
            color: #f3f4f6;
        }
        .editor-line {
            display: flex;
            flex-direction: row;
            height: 22px;
        }
        .editor-line:hover {
            background-color: rgba(31, 41, 55, 0.3);
        }
        .editor-line.active-line {
            background-color: rgba(31, 41, 55, 0.4);
        }
        .line-number {
            width: 50px;
            text-align: right;
            color: #4b5563;
            user-select: none;
            padding-right: 12px;
            flex-shrink: 0;
        }
        .line-content {
            flex: 1;
            white-space: pre;
            overflow-x: auto;
        }
        .line-content.word-wrap {
            white-space: pre-wrap;
            word-break: break-word;
        }
        .editor-cursor {
            width: 2px;
            background-color: #fff;
            position: absolute;
            z-index: 10;
            animation: editor-blink 1s step-end infinite;
        }
        @keyframes editor-blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .editor-selection {
            background-color: rgba(59, 130, 246, 0.3);
            position: absolute;
        }
        .editor-placeholder {
            color: #6b7280;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        /* ── Syntax Highlighting Tokens ── */
        .ed-text { color: #f3f4f6; }
        .ed-whitespace { display: inline; min-width: 0; }

        .ed-h1 { color: #93c5fd; font-weight: 700; }
        .ed-h2 { color: #93c5fd; font-weight: 700; }
        .ed-h3 { color: #60a5fa; font-weight: 600; }
        .ed-h4 { color: #60a5fa; font-weight: 600; }
        .ed-h5 { color: #3b82f6; font-weight: 600; }
        .ed-h6 { color: #3b82f6; font-weight: 600; }

        .ed-bold { font-weight: 700; color: #f9fafb; }
        .ed-italic { font-style: italic; }
        .ed-strikethrough { text-decoration: line-through; color: #9ca3af; }

        .ed-code-inline {
            background-color: rgba(75, 85, 99, 0.5);
            border-radius: 3px;
            padding: 1px 4px;
            font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
            font-size: 0.875em;
            color: #e5e7eb;
        }

        .ed-code-block {
            background-color: rgba(31, 41, 55, 0.5);
            color: #d1d5db;
            font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
        }

        .ed-link { color: #60a5fa; text-decoration: underline; }
        .ed-link-url { color: #3b82f6; opacity: 0.7; }
        .ed-link-text { color: #60a5fa; }
        .ed-wiki-link { color: #a78bfa; text-decoration: underline; text-decoration-style: dotted; }

        .ed-blockquote {
            border-left: 3px solid #4b5563;
            padding-left: 12px;
            color: #9ca3af;
        }

        .ed-list-item { color: #f3f4f6; }
        .ed-list-marker { color: #6b7280; }

        .ed-tag { color: #f97316; }
        .ed-frontmatter { color: #6b7280; font-style: italic; opacity: 0.7; }

        .ed-table-header { font-weight: 700; color: #f9fafb; }
        .ed-table-cell { color: #f3f4f6; }
        .ed-table-border { color: #4b5563; }

        .ed-hr { color: #4b5563; }
        .ed-task-marker { color: #fbbf24; }

        .ed-image { color: #60a5fa; }
        .ed-image-url { color: #3b82f6; opacity: 0.7; }
        .ed-image-alt { color: #9ca3af; font-style: italic; }
    </style>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#3B82F6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tachyon">
    <link data-trunk rel="rust" data-target-name="tachyon_frontend" data-wasm-opt="z">
    <base data-trunk-public-url>
    <script>
        // Tauri desktop detection and API URL configuration.
        // When running inside Tauri, the __TAURI__ global is injected.
        // The frontend's ApiClient reads window.tachyonApiUrl to determine
        // the backend API base URL. In desktop mode, we default to the
        // local server but allow configuration via Tauri's IPC commands.
        (function() {
            if (window.__TAURI__) {
                window.__TACHYON_DESKTOP__ = true;
                // In desktop mode, the user runs `tachyon serve` on the default port.
                // If not set by the user, default to the local server.
                if (!window.tachyonApiUrl) {
                    window.tachyonApiUrl = 'http://localhost:8080/api/v1';
                }
            }
        })();
    </script>
</head>
<body>
    <div id="app">
        <noscript>
            <div style="max-width:800px;margin:2rem auto;padding:0 1rem;font-family:system-ui,sans-serif;">
                <h1 style="font-size:2rem;font-weight:700;margin-bottom:0.5rem;">Tachyon</h1>
                <p style="color:#666;margin-bottom:1.5rem;">A high-performance knowledge management platform</p>
                <nav style="display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;">
                    <a href="/documents" style="display:block;padding:1.5rem;border:1px solid #e5e7eb;border-radius:0.5rem;text-decoration:none;color:inherit;">
                        <h2 style="font-size:1.1rem;margin-bottom:0.25rem;">Documents</h2>
                        <p style="color:#666;font-size:0.875rem;">View and manage your documents</p>
                    </a>
                    <a href="/search" style="display:block;padding:1.5rem;border:1px solid #e5e7eb;border-radius:0.5rem;text-decoration:none;color:inherit;">
                        <h2 style="font-size:1.1rem;margin-bottom:0.25rem;">Search</h2>
                        <p style="color:#666;font-size:0.875rem;">Search across all content</p>
                    </a>
                    <a href="/catalog" style="display:block;padding:1.5rem;border:1px solid #e5e7eb;border-radius:0.5rem;text-decoration:none;color:inherit;">
                        <h2 style="font-size:1.1rem;margin-bottom:0.25rem;">Catalog</h2>
                        <p style="color:#666;font-size:0.875rem;">Browse the project catalog</p>
                    </a>
                </nav>
                <p style="margin-top:2rem;color:#999;font-size:0.875rem;">JavaScript is required for the full interactive experience.</p>
            </div>
        </noscript>
    </div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
</body>
</html>

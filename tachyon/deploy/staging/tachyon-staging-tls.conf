# Tachyon staging — TLS reverse proxy (nginx, host-level).
# Terminates HTTPS on :8443 and proxies to the plain-HTTP tachyon-server
# (systemd user service, listening on 127.0.0.1:8082… wait, it binds 0.0.0.0).
# This vhost therefore also listens on 8443 only; direct access to :8082 is
# blocked by the firewall (ufw/iptables) — see DEPLOYMENT_RUNBOOK.md.
#
# Install (CachyOS host):
#   sudo cp tachyon-staging-tls.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/tachyon-staging-tls.conf /etc/nginx/sites-enabled/
#   sudo mkdir -p /etc/nginx/tachyon
#   # Self-signed for LAN staging (production: real cert via certbot):
#   sudo openssl req -x509 -newkey rsa:2048 -nodes -days 825 \
#     -keyout /etc/nginx/tachyon/tachyon-staging.key \
#     -out /etc/nginx/tachyon/tachyon-staging.crt \
#     -subj "/CN=tachyon-staging.lan" \
#     -addext "subjectAltName=DNS:tachyon-staging.lan,IP:192.168.1.191"
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name tachyon-staging.lan 192.168.1.191;

    ssl_certificate     /etc/nginx/tachyon/tachyon-staging.crt;
    ssl_certificate_key /etc/nginx/tachyon/tachyon-staging.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers (mirrored from the app, belt-and-braces at the edge)
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # WebSocket upgrade for the CRDT collab endpoints
    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8082/health;
        access_log off;
    }
}

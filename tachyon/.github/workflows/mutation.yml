name: Mutation Testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  mutation-test:
    name: Mutation Tests
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tachyon -> target
          key: ${{ runner.os }}-cargo-
      - name: Install cargo-mutant
        run: cargo install cargo-mutant
      - name: Run mutation tests
        working-directory: tachyon
        run: |
          # Only test core, database, search crates to keep CI time reasonable.
          # For full mutation testing run locally: cargo mutant
          cargo mutant --no-times --files tachyon/crates/core/src/ tachyon/crates/database/src/ tachyon/crates/search/src/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-results
          path: tachyon/mutants.out/
          retention-days: 30

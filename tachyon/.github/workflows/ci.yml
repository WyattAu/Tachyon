name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tachyon -> target
          key: ${{ runner.os }}-cargo-
      - name: Check workspace
        working-directory: tachyon
        run: cargo check --all-targets

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tachyon -> target
          key: ${{ runner.os }}-cargo-
      - name: Run unit tests
        working-directory: tachyon
        run: cargo test --workspace --lib

  test:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tachyon
          POSTGRES_PASSWORD: tachyon
          POSTGRES_DB: tachyon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tachyon -> target
          key: ${{ runner.os }}-cargo-
      - name: Run all lib tests with database
        working-directory: tachyon
        env:
          DATABASE_URL: postgres://tachyon:tachyon@localhost:5432/tachyon_test
        run: cargo test --workspace --lib -- --nocapture
      - name: Verify no errors
        working-directory: tachyon
        run: |
          cargo check 2>&1 | grep "^error" && exit 1 || echo "No errors found"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tachyon -> target
          key: ${{ runner.os }}-cargo-
      - name: Check formatting
        working-directory: tachyon
        run: cargo fmt --all -- --check
      - name: Clippy
        working-directory: tachyon
        run: cargo clippy --workspace --lib -- -D warnings

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: cargo-audit
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tachyon -> target
          key: ${{ runner.os }}-cargo-
      - name: Cargo audit
        working-directory: tachyon
        run: cargo audit

  formal:
    name: Formal Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean4-action@v1
      - name: Check Lean4 proofs
        working-directory: tachyon
        run: |
          if [ -d "specs/lean" ]; then
            lean --make src specs 2>&1 || echo "Note: Some proofs may require manual verification"
          else
            echo "No Lean4 specs found"
          fi

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tachyon -> target
          key: ${{ runner.os }}-cargo-
      - name: Check workspace
        working-directory: tachyon
        run: cargo check --all-targets

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tachyon -> target
          key: ${{ runner.os }}-cargo-
      - name: Run unit tests
        working-directory: tachyon
        run: cargo test --workspace --lib

  test:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tachyon
          POSTGRES_PASSWORD: tachyon
          POSTGRES_DB: tachyon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tachyon -> target
          key: ${{ runner.os }}-cargo-
      - name: Run all lib tests with database
        working-directory: tachyon
        env:
          DATABASE_URL: postgres://tachyon:tachyon@localhost:5432/tachyon_test
        run: cargo test --workspace --lib -- --nocapture
      - name: Verify no errors
        working-directory: tachyon
        run: |
          cargo check 2>&1 | grep "^error" && exit 1 || echo "No errors found"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tachyon -> target
          key: ${{ runner.os }}-cargo-
      - name: Check formatting
        working-directory: tachyon
        run: cargo fmt --all -- --check
      - name: Clippy
        working-directory: tachyon
        run: cargo clippy --workspace --lib -- -D warnings

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: cargo-audit
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tachyon -> target
          key: ${{ runner.os }}-cargo-
      - name: Cargo audit
        working-directory: tachyon
        run: cargo audit

  formal:
    name: Formal Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean4-action@v1
      - name: Check Lean4 proofs
        working-directory: tachyon
        run: |
          if [ -d "specs/lean" ]; then
            lean --make src specs 2>&1 || echo "Note: Some proofs may require manual verification"
          else
            echo "No Lean4 specs found"
          fi

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [check, test-unit]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tachyon_test
          POSTGRES_PASSWORD: tachyon_test
          POSTGRES_DB: tachyon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://tachyon_test:tachyon_test@localhost:5432/tachyon_test
      JWT_SECRET: test-secret-for-e2e
      E2E_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        working-directory: tachyon/e2e
        run: npm ci && npx playwright install --with-deps chromium
      - name: Run E2E tests
        working-directory: tachyon/e2e
        run: npm test
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: tachyon/e2e/test-results/
          retention-days: 7

  wasm-size:
    name: WASM Bundle Size
    runs-on: ubuntu-latest
    needs: check
    env:
      RUSTFLAGS: "-C target-feature=+atomics,+bulk-memory,+mutable-globals"
      WASM_SIZE_THRESHOLD: 5242880
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tachyon -> target
          key: ${{ runner.os }}-cargo-
      - name: Install trunk
        run: cargo install trunk
      - name: Build WASM and check size
        working-directory: tachyon
        run: bash scripts/build-wasm.sh
      - name: Analyze WASM bloat
        working-directory: tachyon
        run: bash scripts/analyze-wasm-size.sh

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tachyon -> target
          key: ${{ runner.os }}-cargo-
      - name: Run benchmarks
        working-directory: tachyon
        run: cargo bench --workspace --exclude tachyon-frontend --exclude tachyon-testing -- --output-format bencher | tee benchmark-results.txt
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: tachyon/benchmark-results.txt
          retention-days: 30

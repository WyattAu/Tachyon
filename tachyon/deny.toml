[advisories]
unmaintained = "workspace"
yanked = "deny"
ignore = [
    "RUSTSEC-2023-0071",  # rsa Marvin Attack (medium) - transitive via sqlx-mysql, PostgreSQL only
    "RUSTSEC-2026-0002",  # lru 0.12.5 IterMut unsound - transitive via tantivy, IterMut not used
    "RUSTSEC-2026-0097",  # rand 0.7.3 unsound - transitive via wiremock (dev-dep), not in production
]

[licenses]
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "OpenSSL",
    "MPL-2.0",
    "CC0-1.0",
    "NCSA",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

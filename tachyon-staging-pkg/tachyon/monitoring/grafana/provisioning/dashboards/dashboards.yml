apiVersion: 1
providers:
  - name: "Tachyon Dashboards"
    orgId: 1
    folder: ""
    folderUid: ""
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false

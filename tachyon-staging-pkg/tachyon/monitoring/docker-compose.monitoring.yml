services:
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: tachyon-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--storage.tsdb.retention.size=8GB"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
      - "--web.enable-admin-api"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks:
      - tachyon-monitoring

  grafana:
    image: grafana/grafana:10.4.0
    container_name: tachyon-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL:-http://localhost:3000}
      GF_INSTALL_PLUGINS: grafana-clock-panel
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - tachyon-monitoring

  postgres-exporter:
    image: promcommunity/postgres-exporter:v0.15.0
    container_name: tachyon-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://tachyon:tachyon@postgres:5432/tachyon?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      - postgres
    networks:
      - tachyon-monitoring
      - tachyon-network

  node-exporter:
    image: prom/node-exporter:v1.8.0
    container_name: tachyon-node-exporter
    restart: unless-stopped
    command:
      - "--path.rootfs=/host"
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+)($|/)"
      - "--collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$"
    ports:
      - "9100:9100"
    volumes:
      - /:/host:ro,rslave
    networks:
      - tachyon-monitoring

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    container_name: tachyon-nginx-exporter
    restart: unless-stopped
    command:
      - "--nginx.scrape-uri=http://nginx:8080/nginx_status"
    ports:
      - "9113:9113"
    depends_on:
      - nginx
    networks:
      - tachyon-monitoring
      - tachyon-network

  nginx:
    image: nginx:alpine
    container_name: tachyon-nginx-metrics
    restart: unless-stopped
    volumes:
      - ./nginx-nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8081:8080"
    networks:
      - tachyon-network
    profiles:
      - metrics-only

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  tachyon-monitoring:
    driver: bridge
  tachyon-network:
    external: true
    name: tachyon_tachyon-network

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tachyon — Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #111827;
      color: #f3f4f6;
    }
    .container {
      text-align: center;
      padding: 2rem;
      max-width: 480px;
    }
    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 1.5rem;
      background: #374151;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon svg {
      width: 40px;
      height: 40px;
      stroke: #9ca3af;
      fill: none;
      stroke-width: 2;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }
    p {
      color: #9ca3af;
      margin-bottom: 1.5rem;
      line-height: 1.6;
    }
    .actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    button {
      background: #3B82F6;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 500;
      transition: background 0.2s;
    }
    button:hover { background: #2563EB; }
    button.secondary {
      background: transparent;
      border: 1px solid #4b5563;
      color: #9ca3af;
    }
    button.secondary:hover {
      background: #374151;
      color: #f3f4f6;
    }
    .pending-info {
      margin-top: 2rem;
      padding: 1rem;
      background: #1f2937;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      color: #6b7280;
    }
    .pending-info strong { color: #f59e0b; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.56 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>You're Offline</h1>
    <p>Tachyon is not available right now. Your changes are saved locally and will sync when you're back online.</p>
    <div class="actions">
      <button onclick="window.location.reload()">Try Again</button>
      <button class="secondary" onclick="window.location.href='/'">Go Home</button>
    </div>
    <div class="pending-info" id="pending-info" style="display: none;">
      <strong id="pending-count">0</strong> changes pending sync
    </div>
  </div>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.ready.then(function(reg) {
        if (reg.sync) {
          reg.sync.register('tachyon-sync-pending').catch(function() {});
        }
      });
    }
    var dbReq = indexedDB.open('tachyon_offline', 2);
    dbReq.onsuccess = function(e) {
      var db = e.target.result;
      if (db.objectStoreNames.contains('pending_changes')) {
        var tx = db.transaction('pending_changes', 'readonly');
        var store = tx.objectStore('pending_changes');
        var countReq = store.count();
        countReq.onsuccess = function() {
          var count = countReq.result;
          if (count > 0) {
            document.getElementById('pending-info').style.display = 'block';
            document.getElementById('pending-count').textContent = count;
          }
        };
      }
    };
  </script>
</body>
</html>

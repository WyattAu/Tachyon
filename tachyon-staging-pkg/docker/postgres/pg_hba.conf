# ── Connection Types ──────────────────────────────────────────────
# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Local socket connections (for administrative tools)
local   all             all                                     scram-sha-256

# Replication connections (from standby nodes)
host    replication     ${REPLICATION_USER:-replicator}  samenet         scram-sha-256

# Application connections from backend containers
host    ${POSTGRES_DB:-tachyon}  ${POSTGRES_USER:-tachyon}     samenet         scram-sha-256

# Reject everything else
host    all             all             0.0.0.0/0               reject
host    all             all             ::/0                     reject

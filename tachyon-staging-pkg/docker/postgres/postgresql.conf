# ── Connections ────────────────────────────────────────────────────
listen_addresses = '*'
port = 5432
max_connections = 100
superuser_reserved_connections = 3

# ── Memory ────────────────────────────────────────────────────────
shared_buffers = 512MB
effective_cache_size = 1536MB
work_mem = 16MB
maintenance_work_mem = 128MB
huge_pages = try

# ── WAL ───────────────────────────────────────────────────────────
wal_level = replica
max_wal_size = 2GB
min_wal_size = 512MB
checkpoint_completion_target = 0.9
archive_mode = on
archive_timeout = 60

# ── Replication ───────────────────────────────────────────────────
max_wal_senders = 5
wal_keep_size = 256MB
hot_standby = on

# ── Query Tuning ──────────────────────────────────────────────────
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 200

# ── Logging ───────────────────────────────────────────────────────
log_destination = 'stderr'
logging_collector = off
log_min_duration_statement = 1000
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0
log_line_prefix = '%t [%p] %u@%d '

# ── SSL ───────────────────────────────────────────────────────────
ssl = on
ssl_cert_file = '/etc/nginx/ssl/nginx/fullchain.pem'
ssl_key_file = '/etc/nginx/ssl/nginx/privkey.pem'
ssl_min_protocol_version = 'TLSv1.2'
ssl_prefer_server_ciphers = on

# ── Autovacuum ────────────────────────────────────────────────────
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s

# ── Timezone ──────────────────────────────────────────────────────
timezone = 'UTC'
log_timezone = 'UTC'

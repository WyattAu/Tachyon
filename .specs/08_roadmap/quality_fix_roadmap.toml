  lines = "195"
  description = "hash.iter().map(|b| format!(\"{:02x}\", b)).collect() — slower than hex::encode"
  fix = "Replace with hex::encode(hash) — hex crate is already a dependency."
  verification = "cargo check -p tachyon-server --lib"


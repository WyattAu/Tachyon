# ============================================================================
# PHASE 1: Quick Wins — Zero-risk panic fixes and trivial perf wins
# Effort: ~30 minutes | Risk: None | Dependencies: None
# ============================================================================

[[phase]]
id = "P1"
name = "Quick Wins"
effort_minutes = 30
risk = "none"
description = "Fix production panics, trivial perf wins, dead stub removal. No architectural changes."

  # --- T-1.1: Prometheus handler (will panic on 2nd request) ---
  [[phase.task]]
  id = "T-1.1"
  title = "Fix prometheus handler double-install panic"
  severity = "critical"
  effort_minutes = 2
  file = "crates/server/src/lib.rs"
  lines = "621-626"
  description = """
    prometheus_metrics_handler() calls PrometheusBuilder::new().install_recorder()
    on EVERY request. The global recorder can only be installed once — the 2nd
    request panics via .expect(). Meanwhile, install_metrics() at line 635
    already uses OnceLock correctly. The handler just needs to call that instead.
  """
  fix = """
    Replace lines 621-626 with:
      async fn prometheus_metrics_handler() -> String {
          install_metrics().render()
      }
  """
  verification = "curl /metrics/prometheus twice — second must not panic"

  # --- T-1.2: Mutex unwrap in WASM frontend ---
  [[phase.task]]
  id = "T-1.2"
  title = "Fix mutex poisoning in frontend ApiClient"
  severity = "high"
  effort_minutes = 5
  file = "crates/frontend/src/api.rs"
  lines = "58, 63, 68"
  description = """
    auth_token.lock().unwrap() will panic if a previous lock holder panicked.
    In WASM there is no recovery from a panic — the entire tab dies.
  """
  fix = """
    Replace .unwrap() with .unwrap_or_else(|e| e.into_inner()) on all 3 calls,
    OR add parking_lot = "0.12" to frontend Cargo.toml and use
    parking_lot::Mutex which does not poison.
  """
  verification = "cargo check -p tachyon-frontend --lib"

  # --- T-1.3: HeaderValue unwrap in rate_limit middleware ---
  [[phase.task]]
  id = "T-1.3"
  title = "Fix HeaderValue unwrap in rate limit headers"
  severity = "medium"
  effort_minutes = 3
  file = "crates/server/src/middleware/rate_limit.rs"
  lines = "350-361"
  description = """
    HeaderValue::from_str(&u32.to_string()) can theoretically fail if the
    string contains non-visible ASCII. These are infallible conversions
    (u32/u64 → decimal string is always valid ASCII) but unwrap() is
    inappropriate in middleware that runs on every request.
  """
  fix = """
    Create a helper:
      fn safe_header_int(val: impl ToString) -> HeaderValue {
          HeaderValue::from_str(&val.to_string()).unwrap_or(HeaderValue::from_static("0"))
      }
    Use it for all 3 header inserts.
  """
  verification = "cargo clippy -p tachyon-server --lib"

  # --- T-1.4: HMAC expect in webhook_delivery ---
  [[phase.task]]
  id = "T-1.4"
  title = "Fix HMAC expect in webhook signing"
  severity = "low"
  effort_minutes = 2
  file = "crates/server/src/webhook_delivery.rs"
  lines = "14"
  description = "new_from_slice().expect() — per docs, only fails on empty key."
  fix = """
    Add a guard before the call:
      assert!(!secret.is_empty(), "webhook secret must not be empty");
    Or use .unwrap_or_else with a zero-key HMAC (which would fail signature
    verification downstream, alerting the operator).
  """
  verification = "cargo check -p tachyon-server --lib"

  # --- T-1.5: Remove dead Redis rate limiter variant ---
  [[phase.task]]
  id = "T-1.5"
  title = "Remove dead Redis rate limiter stub"
  severity = "medium"
  effort_minutes = 5
  file = "crates/server/src/middleware/rate_limit.rs"
  lines = "221-257"
  description = """
    RateLimitStore::Redis variant exists but check() always returns Err(()).
    This means if Redis is configured, rate limiting is SILENTLY DISABLED
    (all requests pass through via the Err branch at line 365).
  """
  fix = """
    Remove the Redis variant entirely from RateLimitStore. If Redis support

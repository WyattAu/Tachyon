  # --- T-6.1: Create ServerError ---
  [[phase.task]]
  id = "T-6.1"
  title = "Create unified ServerError type"
  severity = "medium"
  effort_minutes = 20
  file = "crates/server/src/error.rs"  # new file
  description = """
    Currently 8+ error types across crates with no unified conversion.
    Server routes use ad-hoc .map_err closures.
  """
  fix = """
    Create crates/server/src/error.rs:
      use axum::response::{IntoResponse, Response};
      use axum::http::StatusCode;

      #[derive(Debug, thiserror::Error)]
      pub enum ServerError {
          #[error("Database error: {0}")]
          Database(#[from] tachyon_database::DatabaseError),
          #[error("Auth error: {0}")]
          Auth(#[from] AuthError),
          #[error("RBAC error: {0}")]
          Rbac(#[from] tachyon_rbac::RbacError),
          #[error("Search error: {0}")]
          Search(#[from] tachyon_search::SearchError),
          #[error("Not found: {0}")]
          NotFound(String),
          #[error("Validation: {0}")]
          Validation(String),
          #[error("Internal: {0}")]
          Internal(String),
      }

      impl IntoResponse for ServerError {
          fn into_response(self) -> Response {
              let (status, message) = match &self {
                  Self::NotFound(_) => (StatusCode::NOT_FOUND, ...),
                  Self::Validation(_) => (StatusCode::BAD_REQUEST, ...),
                  Self::Auth(_) => (StatusCode::UNAUTHORIZED, ...),
                  _ => (StatusCode::INTERNAL_SERVER_ERROR, ...),
              };
              (status, Json(json!({"error": message}))).into_response()
          }
      }
  """


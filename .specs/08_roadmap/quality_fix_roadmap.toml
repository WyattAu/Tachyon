  [[phase.task]]
  id = "T-6.5"
  title = "Fix error chain preservation"
  severity = "medium"
  effort_minutes = 10
  files = [
    "crates/database/src/search.rs",
    "crates/server/src/middleware/auth.rs",
  ]
  description = """
    Database errors are wrapped with .map_err(|e| DatabaseError::QueryError(e.to_string()))
    losing the original source. Auth errors similarly lose chain.
  """
  fix = """
    In DatabaseError, add a source field:
      QueryError(#[source] Box<dyn std::error::Error + Send + Sync>)
    Or use thiserror's #[source] attribute:
      #[error("Query error: {0}")]
      QueryError(#[from] sqlx::Error)
    This preserves the full error chain for debugging.
  """

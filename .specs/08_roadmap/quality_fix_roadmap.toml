# ============================================================================
# PHASE 5: Rate Limiter Rewrite — DashMap for lock-free concurrency
# Effort: ~60 minutes | Risk: Medium | Dependencies: P1 (T-1.5 removes Redis stub)
# ============================================================================

[[phase]]
id = "P5"
name = "Rate Limiter Rewrite"
effort_minutes = 60
risk = "medium"
description = "Replace RwLock<HashMap> with DashMap for per-key concurrency without global write lock."

  # --- T-5.1: Replace InMemoryStore with DashMap ---
  [[phase.task]]
  id = "T-5.1"
  title = "Replace InMemoryStore with DashMap"
  severity = "high"
  effort_minutes = 30
  file = "crates/server/src/middleware/rate_limit.rs"
  lines = "154-260"
  description = """
    InMemoryStore uses RwLock<HashMap<String, TokenBucket>>. The check_rate_limit
    method takes a write lock on every request, serializing all rate limit checks
    under a single lock. Under high concurrency this is a bottleneck.
  """
  fix = """
    1. Add dashmap = "6" to server Cargo.toml (may already be a transitive dep).
    2. Replace InMemoryStore internals:
         struct InMemoryStore {
             buckets: DashMap<String, TokenBucket>,
             last_cleanup: AtomicInstant, // or just Instant + RwLock for cleanup only
         }
    3. check_rate_limit becomes:
         let mut bucket = self.buckets.entry(key.to_string())
             .or_insert_with(|| TokenBucket::new(limit));
         // check/update bucket inline — no global lock needed
    4. Cleanup: iterate DashMap (retains write lock briefly per shard).
    5. Remove the RwLock import if no longer needed.
  """
  depends_on = ["T-1.5"]

  # --- T-5.2: Add unit tests for concurrent access ---
  [[phase.task]]
  id = "T-5.2"
  title = "Add concurrent rate limiter tests"
